/* Helper to directly launch Microsoft Outlook / default email client and copy rich HTML */
function launchOutlookDirectMail({ to = "", subject = "", body = "", htmlContent = "", onToast, onMailSent }) {
  // 1. Copy rich HTML to clipboard so rich formatting can be pasted into Outlook
  if (htmlContent && navigator.clipboard && window.ClipboardItem) {
    try {
      const typeHtml = "text/html";
      const typeText = "text/plain";
      const blobHtml = new Blob([htmlContent], { type: typeHtml });
      const blobText = new Blob([body || ""], { type: typeText });
      const data = [new ClipboardItem({ [typeHtml]: blobHtml, [typeText]: blobText })];
      navigator.clipboard.write(data).catch(() => {});
    } catch (e) {
      console.warn("Clipboard write error:", e);
    }
  }

  // 2. Build mailto link
  const safeTo = (to || "").trim();
  const mailtoUrl = `mailto:${encodeURIComponent(safeTo)}?subject=${encodeURIComponent(subject || "")}&body=${encodeURIComponent(body || "")}`;

  // 3. Trigger Outlook / default email client
  const tempLink = document.createElement("a");
  tempLink.href = mailtoUrl;
  tempLink.target = "_blank";
  document.body.appendChild(tempLink);
  tempLink.click();
  setTimeout(() => {
    try { document.body.removeChild(tempLink); } catch (e) {}
  }, 500);

  if (onMailSent) onMailSent();
  if (onToast) {
    onToast(`Outlook opened for ${safeTo || 'user'}! Subject & content populated, formatted HTML copied to clipboard.`);
  }
}

const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

function buildHeaderMap(sampleKeys, canonicalList) {
  const list = canonicalList || CANONICAL;
  const map = {};
  const canonNorm = list.map(([k, h]) => [k, norm(h)]);
  sampleKeys.forEach((rawKey) => {
    const nk = norm(rawKey);
    const hit = canonNorm.find(([, nh]) => nh === nk);
    if (hit) map[rawKey] = hit[0];
  });
  return map;
}

function convertRow(raw, headerMap) {
  const out = {};
  Object.keys(raw).forEach((k) => {
    const canon = headerMap[k];
    if (canon) out[canon] = raw[k];
  });
  return out;
}

/* Extract the QID component from a "IP/QID" formatted Vulnerability ID (or Unique id) string. */
function extractQid(idStr) {
  const s = String(idStr || "").trim();
  if (!s) return "";
  const parts = s.split("/");
  return parts.length > 1 ? parts[parts.length - 1].trim() : "";
}

const rawMatchKey = (ip, qid) => `${String(ip || "").trim().toLowerCase()}|${String(qid || "").trim()}`;

/* --------------------------------- parsing helpers --------------------------------- */

function parseDateVal(v) {
  if (v === null || v === undefined || v === "") return null;
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === "number") {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? null : d;
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function safeNum(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? null : n;
}

function classifySeverity(raw) {
  const r = String(raw || "").trim().toLowerCase();
  if (/critical|^5$/.test(r)) return 5;
  if (/high|^4$/.test(r)) return 4;
  if (/medium|moderate|^3$/.test(r)) return 3;
  if (/low|^2$/.test(r)) return 2;
  if (/info|^1$/.test(r)) return 1;
  return 3;
}

function classifyInfra(row) {
  const os = String(row.os || "").toLowerCase();
  if (/cisco|ios[\s-]?xe|nx-os|junos|fortios|panos|catalyst/.test(os)) return "Network / On-Prem";
  const csp = String(row.csp || "").toLowerCase();
  if (/aws|amazon/.test(csp)) return "AWS";
  if (/azure|microsoft/.test(csp)) return "Azure";
  if (/gcp|google/.test(csp)) return "GCP";
  if (csp.trim()) return "Other Cloud";
  if (row.cloudAccount) return "Other Cloud";
  if (row.environment || row.ip) return "Network / On-Prem";
  return "Unknown";
}

function computeRow(raw, today) {
  const row = { ...raw };
  const sevNum = classifySeverity(row.riskRating);
  const statusRaw = String(row.vulnStatus || "").toLowerCase();
  const isOpen = !/fixed|closed/.test(statusRaw);
  const isReopened = /reopen/.test(statusRaw);

  const firstFound = parseDateVal(row.firstFound);
  const lastDetected = parseDateVal(row.lastDetected);
  const dateFixed = parseDateVal(row.dateLastFixed);

  let ageDays = null;
  const refStart = firstFound || lastDetected;
  if (refStart) {
    const refEnd = !isOpen && dateFixed ? dateFixed : today;
    ageDays = Math.max(0, Math.round((refEnd - refStart) / 86400000));
  } else {
    const colAge = safeNum(row.vulnAgeCol);
    if (colAge !== null) ageDays = colAge;
  }

  const slaDays = SLA_DAYS[sevNum];
  const breached = ageDays !== null ? ageDays > slaDays : false;
  const slaDelta = ageDays !== null ? slaDays - ageDays : null;

  const infra = classifyInfra(row);
  const assetKey = row.impactedAsset || row.ip || row.fqdn || row.dns || "Unknown Asset";

  const truRiskNum = safeNum(row.truRisk);
  const truRiskNorm = truRiskNum !== null ? Math.min(truRiskNum, 1000) / 1000 * 10 : 0;
  const rowRiskScore =
    sevNum * 8 +
    Math.min(ageDays || 0, 365) / 365 * 12 +
    (isOpen && breached ? 15 : 0) +
    truRiskNorm;

  const rawWithinSla = String(row.withinSla || row.slaStatus || row.slaCol || "").trim();
  let withinSlaStatus;
  if (rawWithinSla) {
    withinSlaStatus = /past ?due/i.test(rawWithinSla) ? "Past due SLA" : (/within/i.test(rawWithinSla) ? "Within SLA" : rawWithinSla);
  } else {
    withinSlaStatus = isOpen ? (breached ? "Past due SLA" : "Within SLA") : "Closed";
  }

  return {
    ...row,
    sevNum,
    sevLabel: SEV_META[sevNum].label,
    isOpen,
    isReopened,
    ageDays,
    slaDays,
    breached: isOpen && breached,
    slaDelta,
    infra,
    assetKey,
    rowRiskScore,
    hasSeverityData: !!row.riskRating,
    hasDateData: !!refStart,
    withinSlaStatus,
    vulnCategoryVal: String(row.vulnCategory || row.category || "").trim() || "Uncategorized",
    ifOrPciVal: String(row.ifOrPci || "").trim() || "Not specified",
    environmentVal: String(row.environment || "").trim() || "Not specified",
    appNameVal: String(row.appName || "").trim() || "Unknown application",
    cspVal: String(row.csp || "").trim() || "Not specified",
  };
}

const uniqueVals = (rows, key) => Array.from(new Set(rows.map((r) => r[key]).filter(Boolean))).sort();

/* --------------------------------- aggregations --------------------------------- */

function buildAssetAgg(rows) {
  const map = new Map();
  rows.filter((r) => r.isOpen).forEach((r) => {
    if (!map.has(r.assetKey)) {
      map.set(r.assetKey, {
        assetKey: r.assetKey, ip: r.ip, dns: r.dns, infra: r.infra,
        environment: r.environment, appOwner: r.appOwner,
        total: 0, sev5: 0, sev4: 0, sev3: 0,
        breached: 0, maxAge: 0, riskScore: 0,
      });
    }
    const a = map.get(r.assetKey);
    a.total += 1;
    a[`sev${r.sevNum}`] += 1;
    if (r.breached) a.breached += 1;
    if ((r.ageDays || 0) > a.maxAge) a.maxAge = r.ageDays || 0;
    a.riskScore += r.rowRiskScore;
  });
  const assets = Array.from(map.values());
  const maxScore = Math.max(1, ...assets.map((a) => a.riskScore));
  assets.forEach((a) => (a.riskScoreNorm = Math.round((a.riskScore / maxScore) * 100)));
  return assets.sort((a, b) => b.riskScore - a.riskScore);
}

function buildInfraAgg(rows) {
  const infras = ["AWS", "Azure", "GCP", "Other Cloud", "Network / On-Prem", "Unknown"];
  return infras.map((infra) => {
    const subset = rows.filter((r) => r.infra === infra);
    const open = subset.filter((r) => r.isOpen);
    const assetSet = new Set(open.map((r) => r.assetKey));
    const withAge = open.filter((r) => r.ageDays !== null);
    const avgAge = withAge.length ? Math.round(withAge.reduce((s, r) => s + r.ageDays, 0) / withAge.length) : 0;
    const maxAge = withAge.length ? Math.max(...withAge.map((r) => r.ageDays)) : 0;
    const breached = open.filter((r) => r.breached).length;
    return {
      infra,
      assets: assetSet.size,
      openVulns: open.length,
      sev5: open.filter((r) => r.sevNum === 5).length,
      sev4: open.filter((r) => r.sevNum === 4).length,
      sev3: open.filter((r) => r.sevNum === 3).length,
      breached,
      avgAge, maxAge,
      compliance: open.length ? Math.round(((open.length - breached) / open.length) * 100) : 100,
    };
  }).filter((r) => r.openVulns > 0 || r.assets > 0);
}

function buildAgeingData(rows) {
  const open = rows.filter((r) => r.isOpen && r.ageDays !== null && [5, 4, 3].includes(r.sevNum));
  return AGE_BUCKETS.map((b) => {
    const inBucket = open.filter((r) => r.ageDays >= b.min && r.ageDays <= b.max);
    return {
      bucket: b.label,
      Critical: inBucket.filter((r) => r.sevNum === 5).length,
      High: inBucket.filter((r) => r.sevNum === 4).length,
      Medium: inBucket.filter((r) => r.sevNum === 3).length,
    };
  });
}

function buildAppAgg(rows) {
  const map = new Map();
  rows.filter((r) => r.isOpen).forEach((r) => {
    const key = r.appNameVal;
    if (!map.has(key)) {
      map.set(key, {
        appName: key, appOwner: r.appOwner || "-", apmId: r.apmId || "-", organization: r.organization || "-",
        assetsSet: new Set(), total: 0, sev5: 0, sev4: 0, sev3: 0, breached: 0, ageSum: 0, ageCount: 0,
      });
    }
    const a = map.get(key);
    a.assetsSet.add(r.assetKey);
    a.total += 1;
    a[`sev${r.sevNum}`] += 1;
    if (r.breached) a.breached += 1;
    if (r.ageDays !== null) { a.ageSum += r.ageDays; a.ageCount += 1; }
  });
  return Array.from(map.values()).map((a) => ({
    ...a, assets: a.assetsSet.size,
    avgAge: a.ageCount ? Math.round(a.ageSum / a.ageCount) : 0,
    compliance: a.total ? Math.round(((a.total - a.breached) / a.total) * 100) : 100,
  })).sort((a, b) => b.breached - a.breached || b.total - a.total);
}

/* Ownership directory: grouped by App Owner, containing multiple APM IDs */
function buildOwnershipAgg(rows) {
  const map = new Map();
  rows.forEach((r) => {
    const ownerKey = String(r.appOwner || "").trim() || "Unassigned";
    if (!map.has(ownerKey)) {
      map.set(ownerKey, {
        appOwner: ownerKey,
        organization: r.organization || "-",
        assetsSet: new Set(),
        total: 0, sev5: 0, sev4: 0, sev3: 0, breached: 0,
        apps: new Map(),
      });
    }
    const o = map.get(ownerKey);
    const apmId = String(r.apmId || "").trim() || "Unspecified APM ID";
    
    if (!o.apps.has(apmId)) {
      o.apps.set(apmId, {
        apmId,
        appNames: new Set(),
        withinSla: 0,
        pastDue: 0,
        fixedCount: 0,
        openVulns: 0,
        vulnStatus: "Open", // Will be Closed if openVulns == 0
      });
    }
    const a = o.apps.get(apmId);
    if (r.appNameVal) a.appNames.add(r.appNameVal);

    if (r.isOpen) {
      o.assetsSet.add(r.assetKey);
      o.total += 1;
      o[`sev${r.sevNum}`] += 1;
      if (r.breached) o.breached += 1;
      
      a.openVulns += 1;
      if (r.breached) a.pastDue += 1;
      else a.withinSla += 1;
    } else {
      a.fixedCount += 1;
    }
  });

  return Array.from(map.values()).map((o) => {
    const appsList = Array.from(o.apps.values()).map(a => ({
      ...a,
      appName: Array.from(a.appNames).join(", ") || "-",
      vulnStatus: a.openVulns > 0 ? "Open" : "Closed"
    })).sort((a, b) => b.openVulns - a.openVulns);
    
    return {
      ...o,
      apps: appsList,
      assets: o.assetsSet.size,
      compliance: o.total ? Math.round(((o.total - o.breached) / o.total) * 100) : 100,
    };
  }).sort((a, b) => a.appOwner.localeCompare(b.appOwner));
}

function buildWeeklyAgg(rows) {
  const map = new Map();
  rows.filter((r) => r.isOpen).forEach((r) => {
    const key = String(r.weeklyMetrics || "").trim() || "Unspecified";
    if (!map.has(key)) map.set(key, { week: key, total: 0, sev5: 0, sev4: 0, sev3: 0, breached: 0, ageSum: 0, ageCount: 0 });
    const w = map.get(key);
    w.total += 1;
    w[`sev${r.sevNum}`] += 1;
    if (r.breached) w.breached += 1;
    if (r.ageDays !== null) { w.ageSum += r.ageDays; w.ageCount += 1; }
  });
  return Array.from(map.values()).map((w) => ({ ...w, avgAge: w.ageCount ? Math.round(w.ageSum / w.ageCount) : 0 }))
    .sort((a, b) => a.week.localeCompare(b.week));
}

function computePosture(kpi) {
  const compliance = kpi.slaCompliance / 100;
  const sev5Exposure = kpi.totalOpen ? kpi.sev5 / kpi.totalOpen : 0;
  const avgAgeNorm = Math.min(kpi.avgAge || 0, 365) / 365;
  const score = Math.round(100 * (0.4 * compliance + 0.3 * (1 - sev5Exposure) + 0.3 * (1 - avgAgeNorm)));
  return Math.max(0, Math.min(100, score));
}

/* --------------------------- AI remediation assistant --------------------------- */

async function fetchRemediation(vuln, setResp, setLoadingFn, setErrFn) {
  setLoadingFn(true);
  setErrFn(null);
  try {
    const prompt = `You are a security remediation assistant helping a vulnerability management team. Give a clear, actionable remediation plan for this finding.

Vulnerability: ${vuln.vulnName || "Unknown"}
CVE: ${vuln.cveId || "N/A"}
Severity: ${vuln.sevLabel}
Category: ${vuln.vulnCategoryVal}
Asset: ${vuln.ip || vuln.assetKey} (${vuln.dns || vuln.fqdn || "no hostname"})
OS: ${vuln.os || "Unknown"}
Port/Protocol: ${vuln.port || "-"} / ${vuln.protocol || "-"}
Days open: ${vuln.ageDays ?? "unknown"}
Threat: ${vuln.threat || "Not provided by scanner"}
Impact: ${vuln.impact || "Not provided by scanner"}
Scanner recommendation: ${vuln.recommendation || "None provided"}

Respond in under 180 words: 3-5 short numbered remediation steps, plus one line on how to validate the fix. Be specific to this vulnerability and OS/platform where possible.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
      }),
    });
    const data = await response.json();
    const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
    setResp(text || "No guidance returned.");
  } catch (err) {
    setErrFn("Couldn't reach the remediation assistant. Try again.");
  } finally {
    setLoadingFn(false);
  }
}

function Gauge({ score }) {
  const color = score >= 75 ? C.success : score >= 50 ? C.medium : C.critical;
  const r = 62, circ = 2 * Math.PI * r, offset = circ * (1 - score / 100);
  return (
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r={r} fill="none" stroke={C.bgElevated} strokeWidth="12" />
      <circle

        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
        transform="rotate(-90 80 80)"
      />
      <text x="80" y="76" textAnchor="middle" fontSize="30" fontWeight="700" fill={C.textPrimary} fontFamily="ui-monospace, monospace">{score}</text>
      <text x="80" y="96" textAnchor="middle" fontSize="11" fill={C.textMuted}>/ 100</text>

  return (

      ))}

  );
}

/* ----------------------------------- Upload ----------------------------------- */

function UploadPanel({ onData, label, compact, canonicalList }) {
  const inputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);
  const [error, setError] = useState(null);
  const [parsing, setParsing] = useState(false);
  const list = canonicalList || CANONICAL;

  const handleFile = useCallback((file) => {
    if (!file) return;
    setError(null);
    setParsing(true);
    const reader = new FileReader();
    reader.onload = (e) => {
      // Deferred so the loading spinner paints before the (potentially heavy) parse/compute work runs.
      setTimeout(() => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: "array", cellDates: true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
          if (!json.length) { setError("No rows found in the file."); setParsing(false); return; }
          const headerMap = buildHeaderMap(Object.keys(json[0]), list);
          const matchedCount = Object.keys(headerMap).length;
          if (matchedCount < 4) {
            setError("Couldn't recognize the expected column headers in this file. Check the header row matches the expected schema.");
            setParsing(false);
            return;
          }
          const today = new Date();
          const computed = json.map((r) => computeRow(convertRow(r, headerMap), today));
          onData(computed, file.name, matchedCount, list.length);
          setParsing(false);
        } catch (err) {
          setError("Couldn't read this file: " + err.message);
          setParsing(false);
        }
      }, 40);
    };
    reader.readAsArrayBuffer(file);
  }, [onData]);

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={() => setDragOver(false)}
      onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
      onClick={() => !parsing && inputRef.current?.click()}
      style={{
        position: "relative", overflow: "hidden",
        border: `1.5px dashed ${dragOver ? C.accent : C.borderLight}`,
        borderRadius: 12, padding: compact ? 20 : 44, textAlign: "center", cursor: parsing ? "default" : "pointer",
        background: dragOver ? C.accentDim : C.bgElevated, transition: "all .15s",
      }}
    >
      <input
        ref={inputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }}
        onChange={(e) => handleFile(e.target.files[0])}
      />
      {parsing && (
        <div style={{ position: "absolute", inset: 0, background: C.bgElevated, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 10, zIndex: 2 }}>
          <div className="vd-spin" style={{ width: 26, height: 26, borderRadius: "50%", border: `3px solid ${C.border}`, borderTopColor: C.accent }} />
          <div style={{ fontSize: 12.5, color: C.textSecondary }}>Parsing and analyzing export...</div>
        </div>
      )}
      <Upload size={compact ? 22 : 30} color={C.accent} style={{ marginBottom: 10 }} />
      <div style={{ fontSize: compact ? 13 : 15, fontWeight: 600, color: C.textPrimary, marginBottom: 4 }}>
        {label || "Drop your Qualys export here, or click to browse"}
      </div>
      <div style={{ fontSize: 12, color: C.textMuted }}>Accepts .xlsx, .xls, or .csv</div>
      {!compact && <div style={{ fontSize: 10, color: C.textMuted, marginTop: 18, letterSpacing: 0.3 }}>Built by Barathraj V</div>}
      {error && (
        <div style={{ marginTop: 12, fontSize: 12, color: C.critical, background: C.criticalDim, padding: "8px 12px", borderRadius: 7, textAlign: "left" }}>
          {error}
        </div>
      )}
    </div>
  );
}

/* --------------------------------- filter bar --------------------------------- */

function FilterBar({ filters, setFilters, infraOptions, cspOptions, ifPciOptions, appNameOptions, vulnStatusOptions, totalCount = 0, filteredCount = 0 }) {
  const isClean = filters.severity === "all" &&
    filters.vulnStatus === "all" &&
    filters.infra === "all" &&
    filters.slaStatus === "all" &&
    !filters.search &&
    filters.csp === "all" &&
    filters.ifPci === "all" &&
    !filters.appName;

  const resetFilters = () => {
    setFilters({
      severity: "all",
      vulnStatus: "all",
      infra: "all",
      slaStatus: "all",
      search: "",
      csp: "all",
      ifPci: "all",
      appName: ""
    });
  };

  const statusList = useMemo(() => {
    const defaultList = ["Active", "Reopened", "Fixed"];
    if (!vulnStatusOptions || !vulnStatusOptions.length) return defaultList;
    return vulnStatusOptions;
  }, [vulnStatusOptions]);

  const activeFilterCount = useMemo(() => {
    let count = 0;
    if (filters.severity !== "all") count++;
    if (filters.vulnStatus !== "all") count++;
    if (filters.infra !== "all") count++;
    if (filters.slaStatus !== "all") count++;
    if (filters.search) count++;
    if (filters.csp !== "all") count++;
    if (filters.ifPci !== "all") count++;
    if (filters.appName) count++;
    return count;
  }, [filters]);

  const filterCardStyle = {
    background: "linear-gradient(165deg, #181c28 0%, #0f131d 100%)",
    border: "1px solid #28334a",
    borderRadius: 14,
    padding: "16px 18px",
    marginBottom: 20,
    boxShadow: "0 8px 24px rgba(0, 0, 0, 0.45)",
    display: "flex",
    flexDirection: "column",
    gap: 14
  };

  const sectionLabelStyle = {
    fontSize: 10.5,
    fontWeight: 700,
    color: "#94a3b8",
    textTransform: "uppercase",
    letterSpacing: "0.8px",
    marginBottom: 6,
    display: "flex",
    alignItems: "center",
    gap: 6
  };

  const pillGroupStyle = {
    display: "flex",
    gap: 6,
    flexWrap: "wrap"
  };

  const getPillStyle = (active, activeBg, activeColor, activeBorder) => ({
    padding: "6px 12px",
    borderRadius: 7,
    fontSize: 12,
    fontWeight: active ? 600 : 500,
    cursor: "pointer",
    border: `1px solid ${active ? (activeBorder || activeColor || C.accent) : "#2d374d"}`,
    background: active ? (activeBg || C.accentDim) : "#131722",
    color: active ? (activeColor || C.accent) : "#cbd5e1",
    display: "inline-flex",
    alignItems: "center",
    gap: 6,
    whiteSpace: "nowrap",
    boxShadow: active ? `0 2px 8px ${activeBg || 'rgba(99, 102, 241, 0.25)'}` : "none",
    transition: "all 0.18s ease",
    userSelect: "none"
  });

  return (
    <div style={filterCardStyle}>
      {/* Top Header Row: Title, Scope summary, Search, App Filter & Clear All */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12, paddingBottom: 12, borderBottom: "1px solid #232c3f" }}>
        
        {/* Left: Omni Search & App Search */}
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", flex: 1, minWidth: 280 }}>
          {/* Omni Search */}
          <div style={{ position: "relative", flex: 1, minWidth: 240, maxWidth: 360 }}>
            <Search size={14} color="#64748b" style={{ position: "absolute", left: 11, top: 10 }} />
            <input
              value={filters.search}
              onChange={(e) => setFilters(f => ({ ...f, search: e.target.value }))}
              placeholder="Search IP, host, CVE, vulnerability..."
              style={{
                width: "100%",
                background: "#0d1017",
                border: "1px solid #2d374d",
                borderRadius: 8,
                padding: "8px 28px 8px 34px",
                fontSize: 12.5,
                color: "#f8fafc",
                outline: "none"
              }}
            />
            {filters.search && (
              <div
                onClick={() => setFilters(f => ({ ...f, search: "" }))}
                style={{ position: "absolute", right: 8, top: 8, cursor: "pointer", padding: 2, borderRadius: 4, background: "#1f2738", display: "flex" }}
              >
                <X size={12} color="#94a3b8" />
              </div>
            )}
          </div>

          {/* App Name Filter */}
          <div style={{ position: "relative", width: 200 }}>
            <input
              list="vd-app-list"
              value={filters.appName}
              onChange={(e) => setFilters(f => ({ ...f, appName: e.target.value }))}
              placeholder="Filter by App Name..."
              style={{
                width: "100%",
                background: "#0d1017",
                border: "1px solid #2d374d",
                borderRadius: 8,
                padding: "8px 26px 8px 12px",
                fontSize: 12.5,
                color: "#f8fafc",
                outline: "none"
              }}
            />
            {filters.appName && (
              <div
                onClick={() => setFilters(f => ({ ...f, appName: "" }))}
                style={{ position: "absolute", right: 8, top: 8, cursor: "pointer", padding: 2, borderRadius: 4, background: "#1f2738", display: "flex" }}
              >
                <X size={12} color="#94a3b8" />
              </div>
            )}
            <datalist id="vd-app-list">
              {appNameOptions.map(o => <option key={o} value={o} />)}
            </datalist>
          </div>
        </div>

        {/* Right: Record Counter & Clear Filters Action */}
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          {totalCount > 0 && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "#94a3b8", background: "#0d1017", padding: "5px 12px", borderRadius: 6, border: "1px solid #242c3d" }}>
              <span style={{ color: C.accent, fontWeight: 700 }}>{filteredCount.toLocaleString()}</span> of <span>{totalCount.toLocaleString()}</span> findings
              {activeFilterCount > 0 && (
                <span style={{ marginLeft: 4, background: "rgba(99, 102, 241, 0.2)", color: C.accent, padding: "1px 6px", borderRadius: 10, fontWeight: 700, fontSize: 10.5 }}>
                  {activeFilterCount} active
                </span>
              )}
            </div>
          )}

          {!isClean && (
            <button
              onClick={resetFilters}
              style={{
                display: "inline-flex",
                alignItems: "center",
                gap: 5,
                padding: "6px 12px",
                borderRadius: 7,
                fontSize: 11.5,
                fontWeight: 600,
                color: "#f87171",
                background: "rgba(239, 68, 68, 0.12)",
                border: "1px solid rgba(239, 68, 68, 0.35)",
                cursor: "pointer",
                transition: "all 0.15s"
              }}
              title="Clear all active filters"
            >
              <X size={13} /> Reset Filters
            </button>
          )}
        </div>
      </div>

      {/* Main Filter Sections Row: Severity, Vulnerability Status, SLA, Infra, CSP, IF/PCI */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 16 }}>
        
        {/* 1. Severity Filter */}
        <div>
          <div style={sectionLabelStyle}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#ef4444" }} />
            Severity Level
          </div>
          <div style={pillGroupStyle}>
            <div onClick={() => setFilters(f => ({ ...f, severity: "all" }))} style={getPillStyle(filters.severity === "all")}>
              All
            </div>
            <div onClick={() => setFilters(f => ({ ...f, severity: 5 }))} style={getPillStyle(filters.severity === 5, "rgba(239, 68, 68, 0.2)", "#f87171", "#ef4444")}>
              <span style={{ color: "#ef4444", fontSize: 10 }}>●</span> Critical
            </div>
            <div onClick={() => setFilters(f => ({ ...f, severity: 4 }))} style={getPillStyle(filters.severity === 4, "rgba(249, 115, 22, 0.2)", "#fb923c", "#f97316")}>
              <span style={{ color: "#f97316", fontSize: 10 }}>●</span> High
            </div>
            <div onClick={() => setFilters(f => ({ ...f, severity: 3 }))} style={getPillStyle(filters.severity === 3, "rgba(234, 179, 8, 0.2)", "#facc15", "#eab308")}>
              <span style={{ color: "#eab308", fontSize: 10 }}>●</span> Medium
            </div>
          </div>
        </div>

        {/* 2. Vulnerability Status Filter (NEW) */}
        <div>
          <div style={sectionLabelStyle}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#38bdf8" }} />
            Vuln Status
          </div>
          <div style={pillGroupStyle}>
            <div onClick={() => setFilters(f => ({ ...f, vulnStatus: "all" }))} style={getPillStyle(filters.vulnStatus === "all")}>
              All
            </div>
            {statusList.slice(0, 3).map((st) => {
              const isAct = filters.vulnStatus === st;
              const isFixed = st.toLowerCase().includes("fix") || st.toLowerCase().includes("close");
              const isReopen = st.toLowerCase().includes("reopen") || st.toLowerCase().includes("re-open");
              const color = isFixed ? "#34d399" : isReopen ? "#f59e0b" : "#38bdf8";
              const bg = isFixed ? "rgba(52, 211, 153, 0.18)" : isReopen ? "rgba(245, 158, 11, 0.18)" : "rgba(56, 189, 248, 0.18)";
              return (
                <div key={st} onClick={() => setFilters(f => ({ ...f, vulnStatus: st }))} style={getPillStyle(isAct, bg, color, color)}>
                  {st}
                </div>
              );
            })}
            {statusList.length > 3 && (
              <select
                value={statusList.includes(filters.vulnStatus) && statusList.indexOf(filters.vulnStatus) >= 3 ? filters.vulnStatus : ""}
                onChange={(e) => e.target.value && setFilters(f => ({ ...f, vulnStatus: e.target.value }))}
                style={{ ...selectStyle, padding: "5px 8px", fontSize: 11.5, height: 31, minWidth: 90 }}
              >
                <option value="">More...</option>
                {statusList.slice(3).map(st => <option key={st} value={st}>{st}</option>)}
              </select>
            )}
          </div>
        </div>

        {/* 3. SLA Posture Filter */}
        <div>
          <div style={sectionLabelStyle}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#10b981" }} />
            SLA Posture
          </div>
          <div style={pillGroupStyle}>
            <div onClick={() => setFilters(f => ({ ...f, slaStatus: "all" }))} style={getPillStyle(filters.slaStatus === "all")}>
              All
            </div>
            <div onClick={() => setFilters(f => ({ ...f, slaStatus: "breached" }))} style={getPillStyle(filters.slaStatus === "breached", "rgba(239, 68, 68, 0.2)", "#f87171", "#ef4444")}>
              Breached
            </div>
            <div onClick={() => setFilters(f => ({ ...f, slaStatus: "within" }))} style={getPillStyle(filters.slaStatus === "within", "rgba(16, 185, 129, 0.2)", "#34d399", "#10b981")}>
              Within SLA
            </div>
          </div>
        </div>

        {/* 4. Infrastructure & Cloud Segment */}
        <div>
          <div style={sectionLabelStyle}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#a855f7" }} />
            Infrastructure &amp; Scope
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <div style={pillGroupStyle}>
              <div onClick={() => setFilters(f => ({ ...f, infra: "all" }))} style={getPillStyle(filters.infra === "all")}>
                All
              </div>
              {infraOptions.map((i) => (
                <div key={i} onClick={() => setFilters(f => ({ ...f, infra: i }))} style={getPillStyle(filters.infra === i, "rgba(168, 85, 247, 0.18)", "#c084fc", "#a855f7")}>
                  {i}
                </div>
              ))}
            </div>

            {/* Dropdowns */}
            <div style={{ display: "flex", gap: 6 }}>
              <select
                value={filters.csp}
                onChange={(e) => setFilters(f => ({ ...f, csp: e.target.value }))}
                style={{
                  ...selectStyle,
                  padding: "5px 10px",
                  fontSize: 11.5,
                  height: 31,
                  background: filters.csp !== "all" ? "rgba(99, 102, 241, 0.18)" : "#131722",
                  borderColor: filters.csp !== "all" ? C.accent : "#2d374d",
                  color: filters.csp !== "all" ? C.accent : "#cbd5e1"
                }}
              >
                <option value="all">All CSP</option>
                {cspOptions.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>

              <select
                value={filters.ifPci}
                onChange={(e) => setFilters(f => ({ ...f, ifPci: e.target.value }))}
                style={{
                  ...selectStyle,
                  padding: "5px 10px",
                  fontSize: 11.5,
                  height: 31,
                  background: filters.ifPci !== "all" ? "rgba(234, 179, 8, 0.18)" : "#131722",
                  borderColor: filters.ifPci !== "all" ? "#eab308" : "#2d374d",
                  color: filters.ifPci !== "all" ? "#facc15" : "#cbd5e1"
                }}
              >
                <option value="all">All IF / PCI</option>
                {ifPciOptions.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
          </div>
        </div>

      </div>

      {/* Active Filter Pills Bar (Quick Dismiss) */}
      {!isClean && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", paddingTop: 8, borderTop: "1px dashed #28334a" }}>
          <span style={{ fontSize: 11, color: "#64748b", fontWeight: 600 }}>Active Filters:</span>
          {filters.search && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "#1e293b", color: "#f8fafc", padding: "2px 8px", borderRadius: 4, fontSize: 11 }}>
              Search: "{filters.search}"
              <X size={11} style={{ cursor: "pointer" }} onClick={() => setFilters(f => ({ ...f, search: "" }))} />
            </span>
          )}
          {filters.appName && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "#1e293b", color: "#f8fafc", padding: "2px 8px", borderRadius: 4, fontSize: 11 }}>
              App: {filters.appName}
              <X size={11} style={{ cursor: "pointer" }} onClick={() => setFilters(f => ({ ...f, appName: "" }))} />
            </span>
          )}
          {filters.severity !== "all" && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "rgba(239, 68, 68, 0.2)", color: "#f87171", padding: "2px 8px", borderRadius: 4, fontSize: 11 }}>
              Severity: {SEV_META[filters.severity]?.label || filters.severity}
              <X size={11} style={{ cursor: "pointer" }} onClick={() => setFilters(f => ({ ...f, severity: "all" }))} />
            </span>
          )}
          {filters.vulnStatus !== "all" && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "rgba(56, 189, 248, 0.2)", color: "#38bdf8", padding: "2px 8px", borderRadius: 4, fontSize: 11 }}>
              Status: {filters.vulnStatus}
              <X size={11} style={{ cursor: "pointer" }} onClick={() => setFilters(f => ({ ...f, vulnStatus: "all" }))} />
            </span>
          )}
          {filters.slaStatus !== "all" && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: filters.slaStatus === "breached" ? "rgba(239, 68, 68, 0.2)" : "rgba(16, 185, 129, 0.2)", color: filters.slaStatus === "breached" ? "#f87171" : "#34d399", padding: "2px 8px", borderRadius: 4, fontSize: 11 }}>
              SLA: {filters.slaStatus === "breached" ? "Breached" : "Within SLA"}
              <X size={11} style={{ cursor: "pointer" }} onClick={() => setFilters(f => ({ ...f, slaStatus: "all" }))} />
            </span>
          )}
          {filters.infra !== "all" && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "rgba(168, 85, 247, 0.2)", color: "#c084fc", padding: "2px 8px", borderRadius: 4, fontSize: 11 }}>
              Infra: {filters.infra}
              <X size={11} style={{ cursor: "pointer" }} onClick={() => setFilters(f => ({ ...f, infra: "all" }))} />
            </span>
          )}
          {filters.csp !== "all" && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "rgba(99, 102, 241, 0.2)", color: C.accent, padding: "2px 8px", borderRadius: 4, fontSize: 11 }}>
              CSP: {filters.csp}
              <X size={11} style={{ cursor: "pointer" }} onClick={() => setFilters(f => ({ ...f, csp: "all" }))} />
            </span>
          )}
          {filters.ifPci !== "all" && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "rgba(234, 179, 8, 0.2)", color: "#facc15", padding: "2px 8px", borderRadius: 4, fontSize: 11 }}>
              IF/PCI: {filters.ifPci}
              <X size={11} style={{ cursor: "pointer" }} onClick={() => setFilters(f => ({ ...f, ifPci: "all" }))} />
            </span>
          )}
        </div>
      )}
    </div>
  );

/* --------------------------------- chart helpers --------------------------------- */

const tooltipStyle = { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 12, color: C.textPrimary };
const axisStyle = { fontSize: 11, fill: C.textMuted };

/* --------------------------------- detail panel --------------------------------- */

function VulnDetailPanel({ vuln, onClose }) {
  const [resp, setResp] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);

  if (!vuln) return null;

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(4,6,10,0.6)", backdropFilter: "blur(3px)", WebkitBackdropFilter: "blur(3px)", zIndex: 50, display: "flex", justifyContent: "flex-end" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: 440, maxWidth: "90%", background: C.surface, borderLeft: `1px solid ${C.border}`, height: "100%", overflowY: "auto", padding: 24 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
          <div>
            <Badge color={SEV_META[vuln.sevNum].color} dim={SEV_META[vuln.sevNum].dim}>{vuln.sevLabel}</Badge>
            <h2 style={{ fontSize: 15.5, fontWeight: 700, color: C.textPrimary, margin: "10px 0 4px", lineHeight: 1.4 }}>{vuln.vulnName || "Unnamed vulnerability"}</h2>
            <div style={{ fontSize: 12, color: C.textMuted, fontFamily: "'JetBrains Mono', ui-monospace, monospace" }}>{vuln.ip || vuln.assetKey} &middot; {vuln.dns || vuln.fqdn || "no hostname"}</div>
          </div>
          <div onClick={onClose} style={{ cursor: "pointer", padding: 4 }}><X size={18} color={C.textMuted} /></div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
          {[["CVE", vuln.cveId], ["Category", vuln.vulnCategoryVal], ["Port / Protocol", `${vuln.port || "-"}/${vuln.protocol || "-"}`], ["Days open", vuln.ageDays ?? "-"], ["OS", vuln.os], ["Status", vuln.vulnStatus], ["Within SLA", vuln.withinSlaStatus], ["IF or PCI", vuln.ifOrPciVal]].map(([l, v]) => (
            <div key={l}>
              <div style={{ fontSize: 10, color: C.textMuted, textTransform: "uppercase", fontWeight: 600 }}>{l}</div>
              <div style={{ fontSize: 12.5, color: C.textPrimary, marginTop: 2 }}>{v || "-"}</div>
            </div>
          ))}
        </div>

        {["threat", "impact", "recommendation"].map((f) => vuln[f] && (
          <div key={f} style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 11, color: C.textMuted, textTransform: "uppercase", fontWeight: 600, marginBottom: 4 }}>{f}</div>
            <div style={{ fontSize: 12.5, color: C.textSecondary, lineHeight: 1.6 }}>{vuln[f]}</div>
          </div>
        ))}

        <div
          onClick={() => fetchRemediation(vuln, setResp, setLoading, setErr)}
          style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "11px", borderRadius: 8, border: `1px solid ${C.accent}`, color: C.accent, background: C.accentDim, cursor: "pointer", fontSize: 13, fontWeight: 600, marginTop: 8, marginBottom: 16 }}
        >
          <Sparkles size={15} /> {loading ? "Thinking..." : "Get AI remediation guidance"}
        </div>

        {err && <div style={{ fontSize: 12, color: C.critical, marginBottom: 12 }}>{err}</div>}
        {resp && (
          <div style={{ background: C.bgElevated, border: `1px solid ${C.border}`, borderRadius: 8, padding: 14, fontSize: 12.5, color: C.textPrimary, lineHeight: 1.7, whiteSpace: "pre-wrap" }}>
            {resp}
          </div>
        )}
      </div>
    </div>
  );
}

function SeverityPage({ rows }) {
  const stats = [5, 4, 3].map((s) => {
    const open = rows.filter((r) => r.isOpen && r.sevNum === s);
    const assets = new Set(open.map((r) => r.assetKey)).size;
    const withAge = open.filter((r) => r.ageDays !== null);
    const avgAge = withAge.length ? Math.round(withAge.reduce((a, r) => a + r.ageDays, 0) / withAge.length) : 0;
    const withinCount = open.filter((r) => r.withinSlaStatus === "Within SLA").length;
    const pastDueCount = open.filter((r) => r.withinSlaStatus === "Past due SLA").length;
    const compliance = open.length ? Math.round((withinCount / open.length) * 100) : 100;
    return { s, count: open.length, assets, avgAge, withinCount, pastDueCount, compliance };
  });
  const chartData = stats.map((st) => ({ name: SEV_META[st.s].label, count: st.count, fill: SEV_META[st.s].color }));

  return (
    <div>
      <Card style={{ marginBottom: 20 }}>
        <SectionTitle icon={ShieldAlert}>Vulnerabilities by severity</SectionTitle>
        <ResponsiveContainer width="100%" height={240}>
          <BarChart data={chartData}>

        </ResponsiveContainer>

      <Card>
        <SectionTitle>Severity breakdown</SectionTitle>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>

            <tr style={{ borderBottom: `1px solid ${C.border}` }}>

                <th key={h} style={{ textAlign: "left", padding: "8px 10px", color: C.textMuted, fontWeight: 600, fontSize: 11, textTransform: "uppercase" }}>{h}</th>

            </tr>

function SlaPage({ rows, onSelect }) {
  const [sortKey, setSortKey] = useState("overdue");
  const breached = rows.filter((r) => r.isOpen && r.breached);
  const sorted = useMemo(() => {
    const arr = [...breached];
    if (sortKey === "overdue") arr.sort((a, b) => (a.slaDelta ?? 0) - (b.slaDelta ?? 0));
    if (sortKey === "severity") arr.sort((a, b) => b.sevNum - a.sevNum);
    if (sortKey === "age") arr.sort((a, b) => (b.ageDays || 0) - (a.ageDays || 0));
    return arr.slice(0, 200);
  }, [breached, sortKey]);

  const avgOverdue = breached.length ? Math.round(breached.reduce((s, r) => s + Math.abs(r.slaDelta || 0), 0) / breached.length) : 0;
  const maxOverdue = breached.length ? Math.max(...breached.map((r) => Math.abs(r.slaDelta || 0))) : 0;

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 16, marginBottom: 24 }}>
        <KpiCard label="Total breached" value={breached.length} accentColor={C.critical} />

        <KpiCard label="High breached" value={breached.filter((r) => r.sevNum === 4).length} accentColor={C.high} />
        <KpiCard label="Avg overdue" value={`${avgOverdue}d`} />
        <KpiCard label="Max overdue" value={`${maxOverdue}d`} />
      </div>
      <Card>
        <SectionTitle icon={AlertTriangle} right={
          <div style={{ display: "flex", gap: 6 }}>
            {[["overdue", "Most overdue"], ["severity", "Severity"], ["age", "Oldest"]].map(([k, l]) => (
              <div key={k} onClick={() => setSortKey(k)} style={btnStyle(sortKey === k)}>{l}</div>

        <div style={{ maxHeight: 480, overflowY: "auto" }}>

            <thead style={{ position: "sticky", top: 0, background: C.surface }}>
              <tr style={{ borderBottom: `1px solid ${C.border}` }}>

                  <td style={{ padding: "8px 10px", color: C.textPrimary, maxWidth: 240, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.vulnName || "-"}</td>

function OwnershipPage({ rows }) {
  const owners = useMemo(() => buildOwnershipAgg(rows), [rows]);
  const [config, setConfig] = useState(() => {
    try { return JSON.parse(localStorage.getItem("vulnOpsMailConfig")) || defaultMailConfig; }
    catch { return defaultMailConfig; }
  });
  const [pocData, setPocData] = useState(() => {
    try { return JSON.parse(localStorage.getItem("vulnOpsPocData")) || {}; }
    catch { return {}; }
  });
  const [mailStatus, setMailStatus] = useState(() => {
    try { return JSON.parse(localStorage.getItem("vulnOpsMailStatus")) || {}; }
    catch { return {}; }
  });
  const [showConfig, setShowConfig] = useState(false);
  const [activeMailOwner, setActiveMailOwner] = useState(null);
  
  const [showConfigPrompt, setShowConfigPrompt] = useState(false);
  const [pendingMailOwner, setPendingMailOwner] = useState(null);
  const [toast, setToast] = useState(null);

  const showToast = (msg, type = "success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  const saveConfig = (newCfg) => {
    setConfig(newCfg);
    localStorage.setItem("vulnOpsMailConfig", JSON.stringify(newCfg));
    localStorage.setItem("vulnOpsLinksConfigured", "true");
    showToast("Link configuration updated successfully!");
  };

  const handleOpenMailTemplate = (owner) => {
    const isConfigured = localStorage.getItem("vulnOpsLinksConfigured") === "true";
    if (!isConfigured) {
      setPendingMailOwner(owner);
      setShowConfigPrompt(true);
    } else {
      setActiveMailOwner(owner);
    }
  };

  const handlePocUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = window.XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = window.XLSX.utils.sheet_to_json(sheet, { defval: "" });
        const newPocData = { ...pocData };
        const newMailStatus = { ...mailStatus };
        json.forEach(r => {
          const ownerKey = String(r["App Owner"] || "").trim();
          const apmKey = String(r["APM ID"] || "").trim();
          if (ownerKey) {
            if (!newPocData[ownerKey]) newPocData[ownerKey] = {};
            newPocData[ownerKey][apmKey] = r["POC"];
            if (r["Mail Status"]) newMailStatus[ownerKey] = r["Mail Status"];
          }
        });
        setPocData(newPocData);
        setMailStatus(newMailStatus);
        localStorage.setItem("vulnOpsPocData", JSON.stringify(newPocData));
        localStorage.setItem("vulnOpsMailStatus", JSON.stringify(newMailStatus));
        showToast("POC Tracker loaded successfully!");
      } catch (err) {
        showToast("Failed to parse POC Tracker: " + err.message, "warn");
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = null; // reset
  };

  const markMailSent = (ownerKey) => {
    const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    const statusStr = `Initial Mail sent on ${dateStr}`;

    localStorage.setItem("vulnOpsMailStatus", JSON.stringify(newStatus));
  };

  return (
    <Card>
      <SectionTitle icon={IdCard} right={
        <div style={{ display: "flex", gap: 10 }}>
          <label className="vd-nav" style={{ ...btnStyle(false), padding: "6px 12px", background: C.surfaceHover, border: `1px solid ${C.borderLight}` }}>
            Upload POC Tracker
            <input type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={handlePocUpload} />
          </label>
          <div onClick={() => setShowConfig(!showConfig)} style={{ ...btnStyle(showConfig), padding: "6px 12px" }}>
            Configure Links
          </div>
          <span style={{ fontSize: 11.5, color: C.textMuted, fontFamily: "'JetBrains Mono', ui-monospace, monospace", alignSelf: "center", marginLeft: 10 }}>{owners.length} App Owners</span>
        </div>
      }>
        Ownership directory
      </SectionTitle>

      {showConfig && (
        <div style={{ padding: 16, background: C.bgElevated, borderRadius: 8, border: `1px solid ${C.borderLight}`, marginBottom: 20 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12, color: C.textPrimary }}>Mail Template Link Configuration</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {Object.keys(config).map(k => (
              <div key={k}>
                <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 4 }}>
                  {k === "aistDashboard" ? "AIST Dashboard URL" : k === "saviyntDocs" ? "Saviynt Instructions URL / Title" : k === "rem" ? "REM (Exception Management) URL" : k === "dtvReports" ? "DTV Reports URL" : k}
                </div>
                <input
                  value={config[k]}
                  onChange={e => saveConfig({ ...config, [k]: e.target.value })}
                  style={{ width: "100%", padding: "8px 10px", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, color: C.textPrimary, fontSize: 12 }}
                />
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ fontSize: 11.5, color: C.textMuted, marginBottom: 14 }}>

      </div>
      <div style={{ overflowX: "auto", overflowY: "auto", maxHeight: "65vh" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, minWidth: 1000 }}>
          <thead style={{ position: "sticky", top: 0, background: C.surface, zIndex: 1 }}>
            <tr style={{ borderBottom: `1px solid ${C.border}` }}>
              {["App Owner", "Organization", "Apps/APMs", "Assets", "Open vulns", "SLA breached", "Compliance", "POC", "Mail Status", "Actions"].map((h) => (
                <th key={h} style={{ textAlign: "left", padding: "8px 10px", color: C.textMuted, fontWeight: 600, fontSize: 10.5, textTransform: "uppercase" }}>{h}</th>
              ))}

          <tbody>

function MailTemplateModal({ owner, config, pocData, onClose, onMailSent, onToast }) {
  const contentRef = useRef(null);
  const [headerColor, setHeaderColor] = useState("#1E3A8A");
  const [copied, setCopied] = useState(false);
  
  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const d = new Date();
  const currentMonth = monthNames[d.getMonth()];
  const currentYear = d.getFullYear();

  const defaultRecipient = useMemo(() => {
    if (owner.appOwnerEmail) return owner.appOwnerEmail;
    if (owner.appOwner && owner.appOwner.includes("@")) return owner.appOwner;
    if (pocData && pocData[owner.appOwner]) {
      const pocList = Object.values(pocData[owner.appOwner]).filter(Boolean);
      const emailPoc = pocList.find(p => typeof p === 'string' && p.includes("@"));
      if (emailPoc) return emailPoc;
    }
    return "";
  }, [owner, pocData]);

  const [recipient, setRecipient] = useState(defaultRecipient);
  const [subject, setSubject] = useState(`AIST Qualys Results for APMID's - ${currentMonth} ${currentYear}`);

  const safeConfig = {
    aistDashboard: config?.aistDashboard || "https://aist.dashboard.url",
    saviyntDocs: config?.saviyntDocs || "Instructions for requesting viewer access via Saviynt.docx",
    rem: config?.rem || "https://rem.exception.url",
    dtvReports: config?.dtvReports || "https://dtv.reports.url"
  };

  const getPlainTextBody = () => {
    const greeting = `Hi ${owner.appOwner || 'Team'},\n\n`;
    const intro = `Good day! Refer to the AIST Dashboard (${safeConfig.aistDashboard}) to identify active vulnerabilities associated with the APM ID/IDs:\n\n`;
    
    let appTable = "Application Name | APM ID\n--------------------------------------------------\n";
    owner.apps.forEach(a => {
      appTable += `${a.appName} | ${a.apmId}\n`;
    });
    appTable += "\n";

    const doss = `As per DOSS (DIRECTV Official Security Standards), remediation timelines are as follows:\n` +
      `• Critical (PCI/Internet-Facing): <= 30 days | Non-critical: <= 30 days\n` +
      `• High (PCI/Internet-Facing): <= 90 days | Non-critical: <= 120 days\n` +
      `• Medium: <= 180 days\n` +
      `• Low / Informational: Remediation as per applicability\n\n`;

    const notes = `Important Notes:\n` +
      `1. Instructions for requesting viewer access via Saviynt: ${safeConfig.saviyntDocs}\n` +
      `2. The vulnerabilities may take 1-2 business days to get reflected in Dashboard.\n` +
      `3. For remediation guidance, right-click the vulnerability and refer to the "Recommendation" field in the Drill-Through view.\n` +
      `4. If remediation cannot be completed within the timeline, submit a REM (Risk Exception Management) request: ${safeConfig.rem}\n` +
      `5. Please refer DTV_VA-Reports (${safeConfig.dtvReports}) for the scan results associated with the application owners and prioritize the remediation of past due vulnerabilities.\n\n` +
      `Note: PowerBI dashboard data will be refreshed on every Monday.\n`;

    return greeting + intro + appTable + doss + notes;
  };
  
  const handleCopy = () => {
    if (contentRef.current) {
      const htmlContent = contentRef.current.innerHTML;
      const plainText = contentRef.current.innerText;
      if (navigator.clipboard && window.ClipboardItem) {
        const typeHtml = "text/html";
        const typeText = "text/plain";
        const blobHtml = new Blob([htmlContent], { type: typeHtml });
        const blobText = new Blob([plainText], { type: typeText });
        const data = [new ClipboardItem({ [typeHtml]: blobHtml, [typeText]: blobText })];
        navigator.clipboard.write(data).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 3000);
          onMailSent();
          if (onToast) onToast("Mail content copied to clipboard (Outlook format preserved)!");
        }).catch(() => {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
    }
  };

  const fallbackCopy = () => {
    const range = document.createRange();
    range.selectNodeContents(contentRef.current);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    setCopied(true);
    setTimeout(() => setCopied(false), 3000);
    onMailSent();
    if (onToast) onToast("Mail content copied to clipboard!");
  };

  const handleDirectMail = () => {
    const plainText = getPlainTextBody();
    const htmlContent = contentRef.current ? contentRef.current.innerHTML : "";
    launchOutlookDirectMail({
      to: recipient,
      subject: subject,
      body: plainText,
      htmlContent: htmlContent,
      onToast: onToast,
      onMailSent: () => {
        setCopied(true);
        setTimeout(() => setCopied(false), 3000);
        onMailSent();
      }
    });
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 999, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, width: "100%", maxWidth: 840, maxHeight: "90vh", display: "flex", flexDirection: "column", boxShadow: "0 10px 30px rgba(0,0,0,0.5)" }}>
        <div style={{ padding: "16px 20px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <Mail size={18} color={C.accent} />
            <div style={{ fontSize: 15, fontWeight: 600, color: C.textPrimary }}>Mail Template &mdash; {owner.appOwner}</div>
          </div>
          <div onClick={onClose} style={{ cursor: "pointer", padding: 4, borderRadius: 4, background: C.bgElevated }}><X size={16} color={C.textMuted} /></div>
        </div>

        <div style={{ padding: 20, overflowY: "auto", flex: 1 }}>
          {/* Email Header Configuration Fields */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
            <div style={{ background: C.bgElevated, padding: "10px 14px", borderRadius: 8, border: `1px solid ${C.borderLight}` }}>
              <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 4, fontWeight: 600 }}>To (Recipient Email / User)</div>
              <input
                type="text"
                value={recipient}
                onChange={(e) => setRecipient(e.target.value)}
                placeholder="e.g. user@company.com or Application Owner"
                style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4, padding: "6px 10px", color: C.textPrimary, fontSize: 13, outline: "none" }}
              />
            </div>
            <div style={{ background: C.bgElevated, padding: "10px 14px", borderRadius: 8, border: `1px solid ${C.borderLight}` }}>
              <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 4, fontWeight: 600 }}>Subject</div>
              <input
                type="text"
                value={subject}
                onChange={(e) => setSubject(e.target.value)}
                style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4, padding: "6px 10px", color: C.textPrimary, fontSize: 13, fontWeight: 600, outline: "none" }}
              />
            </div>
          </div>

}

function FollowUpMailTemplateModal({ filteredRows, onClose, onToast }) {
  const contentRef = useRef(null);
  const [headerColor, setHeaderColor] = useState("#0f766e");
  const [copied, setCopied] = useState(false);
  
  const config = useMemo(() => {
    try { 
      const saved = JSON.parse(localStorage.getItem("vulnOpsMailConfig"));
      if (saved && typeof saved === "object") return saved;
      return defaultMailConfig;
    }
    catch { return defaultMailConfig; }
  }, []);
  
  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const d = new Date();
  const currentMonth = monthNames[d.getMonth()];
  const currentYear = d.getFullYear();
  
  const activeRows = filteredRows ? filteredRows.filter(r => r.isOpen) : [];
  const total = activeRows.length;
  const pastSlaCount = filteredRows ? activeRows.filter(r => r.withinSlaStatus === "Past due SLA").length : 0;
  const withinSlaCount = filteredRows ? activeRows.filter(r => r.withinSlaStatus === "Within SLA").length : 0;
  const slaApplicableTotal = pastSlaCount + withinSlaCount;
  
  const isOnlyWithinSla = withinSlaCount > 0 && pastSlaCount === 0;
  const isOnlyPastSla = pastSlaCount > 0 && withinSlaCount === 0;
  
  const withinPct = slaApplicableTotal > 0 ? Math.round((withinSlaCount / slaApplicableTotal) * 100) : (isOnlyWithinSla ? 100 : 0);
  const pastPct = slaApplicableTotal > 0 ? (100 - withinPct) : (isOnlyPastSla ? 100 : 0);

  const scanCounts = {};
  if (activeRows.length > 0) {
    activeRows.forEach(r => {
      const st = r.scanType || r.category || "General Scan";
      scanCounts[st] = (scanCounts[st] || 0) + 1;
    });
  }
  
  const maxScan = Math.max(...Object.values(scanCounts), 1);
  const scanColors = ["#0284c7", "#0d9488", "#8b5cf6", "#f97316", "#ec4899", "#10b981"];
  const scanBars = Object.keys(scanCounts).map((k, i) => {
    const count = scanCounts[k];
    const pctOfTotal = total > 0 ? Math.round((count / total) * 100) : 0;
    const barWidth = Math.max(Math.round((count / maxScan) * 100), 1);
    return {
      name: k,
      count: count,
      pctOfTotal: pctOfTotal,
      barWidth: barWidth,
      color: scanColors[i % scanColors.length]
    };
  }).sort((a,b) => b.count - a.count);

  const appApmMap = {};
  activeRows.forEach(r => {
    const app = (r.appName || r.raw?.["Application Name"] || "Unknown Application").trim();
    const apm = (r.apmId || r.raw?.["APM ID"] || "N/A").trim();
    if (!appApmMap[app]) {
      appApmMap[app] = new Set();
    }
    if (apm && apm !== "N/A") {
      appApmMap[app].add(apm);
    }
  });

  const appApmList = Object.keys(appApmMap).map(appName => ({
    appName,
    apmIds: Array.from(appApmMap[appName])
  }));

  const rawAppNames = Array.from(new Set(activeRows.map(a => a.appName || a.raw?.["Application Name"]).filter(Boolean)));
  const appNames = rawAppNames.length > 0 ? rawAppNames.join(", ") : "<App names>";

  const rawApmIds = Array.from(new Set(activeRows.map(a => a.apmId || a.raw?.["APM ID"]).filter(Boolean)));
  const apmIdsDisplay = rawApmIds.length > 0 ? rawApmIds : ["APM0012345"];
  const apmIdsString = apmIdsDisplay.join(", ");

  const ownerNames = useMemo(() => {
    return Array.from(new Set(activeRows.map(r => r.appOwner).filter(Boolean)));
  }, [activeRows]);

  const recipientGreeting = ownerNames.length === 1 ? `Hi ${ownerNames[0]},` : ownerNames.length > 1 && ownerNames.length <= 3 ? `Hi ${ownerNames.join(', ')},` : `Hello Team,`;

  const defaultRecipient = useMemo(() => {
    const emailOwners = ownerNames.filter(o => o.includes("@"));
    return emailOwners.join("; ");
  }, [ownerNames]);

  const [recipient, setRecipient] = useState(defaultRecipient);
  const [subject, setSubject] = useState(`Action Required: Remediation of Active Vulnerabilities for "${currentMonth} - ${apmIdsString}"`);

  const safeConfig = {
    aistDashboard: config?.aistDashboard || "https://aist.dashboard.url",
    rem: config?.rem || "https://rem.exception.url",
    saviyntDocs: config?.saviyntDocs || "Instructions for requesting viewer access via Saviynt.docx",
    runbook: config?.saviyntDocs || config?.aistDashboard || "https://dtv.security.runbook.url"
  };

  const getFollowUpPlainText = () => {
    const greeting = `${recipientGreeting}\n\n`;
    const intro = `The latest vulnerability scan results have been refreshed. Please find the active findings and associated APM IDs below:\n\n`;
    
    let appTable = "Application Name | APM ID(s)\n--------------------------------------------------\n";
    appApmList.forEach(item => {
      appTable += `${item.appName} | ${item.apmIds.join(", ") || "N/A"}\n`;
    });
    appTable += "\n";

    let summary = `Executive Summary:\n` +
      `• Total vulnerabilities: ${total}\n` +
      `• Breached SLA: ${pastSlaCount}\n` +
      `• Within SLA: ${withinSlaCount} (${withinPct}%)\n` +
      `• Past SLA: ${pastSlaCount} (${pastPct}%)\n\n`;

    let details = `Detailed findings and severity breakdowns are available in the AIST Dashboard (${safeConfig.aistDashboard}).\n` +
      `Please prioritize remediation within applicable SLA timelines. If remediation cannot be completed within SLA, submit a REM request: ${safeConfig.rem}\n\n`;

    let doss = `As per DOSS remediation timelines:\n` +
      `• Critical (PCI/Internet-Facing): <= 30 days | Non-critical: <= 30 days\n` +
      `• High (PCI/Internet-Facing): <= 90 days | Non-critical: <= 120 days\n` +
      `• Medium: <= 180 days\n\n`;

    let links = `Important Resources:\n` +
      `• AIST Dashboard: ${safeConfig.aistDashboard}\n` +
      `• REM Exception Request: ${safeConfig.rem}\n` +
      `• Saviynt Access Runbook: ${safeConfig.saviyntDocs}\n\n` +
      `Thank you for your continued partnership.\n`;

    return greeting + intro + appTable + summary + details + doss + links;
  };

  const handleCopy = () => {
    if (contentRef.current) {
      const htmlContent = contentRef.current.innerHTML;
      const plainText = contentRef.current.innerText;
      if (navigator.clipboard && window.ClipboardItem) {
        const typeHtml = "text/html";
        const typeText = "text/plain";
        const blobHtml = new Blob([htmlContent], { type: typeHtml });
        const blobText = new Blob([plainText], { type: typeText });
        const data = [new ClipboardItem({ [typeHtml]: blobHtml, [typeText]: blobText })];
        navigator.clipboard.write(data).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 3000);
          if (onToast) onToast("Follow up mail content copied to clipboard (Outlook format preserved)!");
        }).catch(() => {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
    }
  };

  const fallbackCopy = () => {
    const range = document.createRange();
    range.selectNodeContents(contentRef.current);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    setCopied(true);
    setTimeout(() => setCopied(false), 3000);
    if (onToast) onToast("Follow up mail content copied to clipboard!");
  };

  const handleDirectMail = () => {
    const plainText = getFollowUpPlainText();
    const htmlContent = contentRef.current ? contentRef.current.innerHTML : "";
    launchOutlookDirectMail({
      to: recipient,
      subject: subject,
      body: plainText,
      htmlContent: htmlContent,
      onToast: onToast,
      onMailSent: () => {
        setCopied(true);
        setTimeout(() => setCopied(false), 3000);
      }
    });
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 999, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, width: "100%", maxWidth: 880, maxHeight: "90vh", display: "flex", flexDirection: "column", boxShadow: "0 10px 30px rgba(0,0,0,0.5)" }}>
        <div style={{ padding: "16px 20px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <Mail size={18} color="#0f766e" />
            <div style={{ fontSize: 15, fontWeight: 600, color: C.textPrimary }}>Follow Up Mail Template</div>
          </div>
          <div onClick={onClose} style={{ cursor: "pointer", padding: 4, borderRadius: 4, background: C.bgElevated }}><X size={16} color={C.textMuted} /></div>
        </div>

        <div style={{ padding: 20, overflowY: "auto", flex: 1 }}>
          {/* Email Header Configuration Fields */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
            <div style={{ background: C.bgElevated, padding: "10px 14px", borderRadius: 8, border: `1px solid ${C.borderLight}` }}>
              <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 4, fontWeight: 600 }}>To (Recipient Email(s) / Users)</div>
              <input
                type="text"
                value={recipient}
                onChange={(e) => setRecipient(e.target.value)}
                placeholder="e.g. owner@company.com; lead@company.com"
                style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4, padding: "6px 10px", color: C.textPrimary, fontSize: 13, outline: "none" }}
              />
            </div>
            <div style={{ background: C.bgElevated, padding: "10px 14px", borderRadius: 8, border: `1px solid ${C.borderLight}` }}>
              <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 4, fontWeight: 600 }}>Subject</div>
              <input
                type="text"
                value={subject}
                onChange={(e) => setSubject(e.target.value)}
                style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4, padding: "6px 10px", color: C.textPrimary, fontSize: 13, fontWeight: 600, outline: "none" }}
              />
            </div>
          </div>
          
          <div ref={contentRef} style={{ background: "#ffffff", color: "#111827", padding: "24px", borderRadius: 8, fontSize: 13, fontFamily: "Aptos, 'Aptos Display', Calibri, Arial, sans-serif", lineHeight: 1.6 }}>
            <p style={{ margin: "0 0 14px 0", color: "#111827" }}>{recipientGreeting}</p>
            <p style={{ margin: "0 0 16px 0", color: "#111827" }}>
              The latest vulnerability scan results have been refreshed. Please find the active findings and associated APM IDs below:
            </p>

            {/* Application & APM ID Table in Aptos font */}
            <table border="1" cellPadding="8" cellSpacing="0" style={{ borderCollapse: "collapse", width: "100%", marginBottom: 20, border: "1px solid #94a3b8", fontFamily: "Aptos, 'Aptos Display', Calibri, Arial, sans-serif" }}>
              <thead>
                <tr style={{ backgroundColor: headerColor }}>
                  <th style={{ border: "1px solid #94a3b8", padding: "8px 12px", textAlign: "left", backgroundColor: headerColor, color: "#ffffff", fontWeight: 700, fontSize: 12.5, width: "55%" }}>

                  <th style={{ border: "1px solid #94a3b8", padding: "8px 12px", textAlign: "left", backgroundColor: headerColor, color: "#ffffff", fontWeight: 700, fontSize: 12.5, width: "45%" }}>

  return (
    <Card>
      <SectionTitle icon={ListChecks} right={<span style={{ fontSize: 11.5, color: C.textMuted, fontFamily: "'JetBrains Mono', ui-monospace, monospace" }}>{rows.length.toLocaleString()} records</span>}>

        </div>

    </Card>
  );
}

function AverageAgeCalc({ allRows }) {
  const [f, setF] = useState({ status: "all", severity: [], ifPci: "all", slaStatus: "all", category: "all", environment: "all" });
  const statusOptions = useMemo(() => uniqueVals(allRows, "vulnStatus"), [allRows]);
  const ifPciOptions = useMemo(() => uniqueVals(allRows, "ifOrPciVal"), [allRows]);
  const slaOptions = useMemo(() => uniqueVals(allRows, "withinSlaStatus"), [allRows]);
  const categoryOptions = useMemo(() => uniqueVals(allRows, "vulnCategoryVal"), [allRows]);
  const envOptions = useMemo(() => uniqueVals(allRows, "environmentVal"), [allRows]);

  const toggleSeverity = (val) => {
    setF((prev) => {
      const has = prev.severity.includes(val);
      return { ...prev, severity: has ? prev.severity.filter((s) => s !== val) : [...prev.severity, val] };
    });
  };

  const subset = useMemo(() => allRows.filter((r) => {
    if (f.status !== "all" && r.vulnStatus !== f.status) return false;
    if (f.severity.length > 0 && !f.severity.includes(String(r.sevNum))) return false;
    if (f.ifPci !== "all" && r.ifOrPciVal !== f.ifPci) return false;
    if (f.slaStatus !== "all" && r.withinSlaStatus !== f.slaStatus) return false;
    if (f.category !== "all" && r.vulnCategoryVal !== f.category) return false;
    if (f.environment !== "all" && r.environmentVal !== f.environment) return false;
    return r.ageDays !== null;
  }), [allRows, f]);

  const avg = subset.length ? Math.round(subset.reduce((s, r) => s + r.ageDays, 0) / subset.length) : 0;

  const groupBy = (key) => {
    const map = new Map();
    subset.forEach((r) => {
      const k = r[key];
      if (!map.has(k)) map.set(k, { key: k, count: 0, sum: 0 });
      const c = map.get(k);
      c.count += 1;
      c.sum += r.ageDays;
    });
    return Array.from(map.values()).map((c) => ({ ...c, avg: Math.round(c.sum / c.count) })).sort((a, b) => b.avg - a.avg);
  };
  const byCategory = useMemo(() => groupBy("vulnCategoryVal").slice(0, 12), [subset]);
  const byEnv = useMemo(() => groupBy("environmentVal"), [subset]);

  const selectField = (label, key, options) => (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontSize: 10.5, color: C.textMuted, textTransform: "uppercase", fontWeight: 600 }}>{label}</span>
      <select value={f[key]} onChange={(e) => setF((prev) => ({ ...prev, [key]: e.target.value }))} style={selectStyle}>
        <option value="all">All</option>
        {options.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );

  return (
    <Card>
      <SectionTitle icon={Clock}>Average vulnerability age calculator</SectionTitle>
      <div style={{ fontSize: 11.5, color: C.textMuted, marginBottom: 14 }}>
