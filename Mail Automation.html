function ComparePage({ rows, prevRows, setPrevRows }) {
  if (!prevRows) {
    return (
      <Card>
        <SectionTitle icon={GitCompare}>Compare against a previous snapshot</SectionTitle>
        <p style={{ fontSize: 13, color: C.textSecondary, marginTop: 0, marginBottom: 16, lineHeight: 1.6 }}>
          Upload an earlier Qualys export to see what changed &mdash; new findings, resolved findings, and net movement since then.
        </p>
        <UploadPanel
          compact
          label="Drop the previous Qualys export here"
          onData={(computed) => setPrevRows(computed.filter((r) => r.sevNum >= 3))}
        />
      </Card>
    );
  }

  const currentOpenKeys = new Set(rows.filter((r) => r.isOpen).map((r) => r.uniqueId || r.vulnId || `${r.ip}|${r.vulnName}`));
  const prevOpenKeys = new Set(prevRows.filter((r) => r.isOpen).map((r) => r.uniqueId || r.vulnId || `${r.ip}|${r.vulnName}`));

  let newCount = 0, resolvedCount = 0, persistentCount = 0;
  currentOpenKeys.forEach((k) => (prevOpenKeys.has(k) ? persistentCount++ : newCount++));
  prevOpenKeys.forEach((k) => { if (!currentOpenKeys.has(k)) resolvedCount++; });

  const net = newCount - resolvedCount;

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
        <KpiCard label="New vulnerabilities" value={newCount} accentColor={C.critical} icon={TrendingUp} />
        <KpiCard label="Resolved" value={resolvedCount} accentColor={C.success} icon={TrendingDown} />
        <KpiCard label="Persistent" value={persistentCount} />
        <KpiCard label="Net change" value={(net >= 0 ? "+" : "") + net} accentColor={net > 0 ? C.critical : C.success} />
      </div>
      <Card>
        <SectionTitle>Summary</SectionTitle>
        <p style={{ fontSize: 13, color: C.textSecondary, lineHeight: 1.7 }}>
          The previous snapshot had <b style={{ color: C.textPrimary }}>{prevOpenKeys.size.toLocaleString()}</b> open findings.
          The current snapshot has <b style={{ color: C.textPrimary }}>{currentOpenKeys.size.toLocaleString()}</b> open findings &mdash;{" "}
          <b style={{ color: net > 0 ? C.critical : C.success }}>{net > 0 ? `${net} more` : `${Math.abs(net)} fewer`}</b> than before.
          Matching is based on Unique id / Vulnerability ID (falling back to IP + vulnerability name when IDs are missing).
        </p>
      </Card>
    </div>
  );
}

function RawVerifyPage({ allRows, rawRows, setRawRows }) {
  const [statusFilter, setStatusFilter] = useState("all");

  const rawMap = useMemo(() => {
    const m = new Map();
    (rawRows || []).forEach((r) => {
      const qid = String(r.qid || "").trim();
      if (!qid || !r.ip) return;
      m.set(rawMatchKey(r.ip, qid), r);
    });
    return m;
  }, [rawRows]);

  const results = useMemo(() => {
    if (!rawRows) return [];
    return allRows.filter((r) => r.isOpen).map((r) => {
      const qid = extractQid(r.vulnId) || extractQid(r.uniqueId);
      const match = qid ? rawMap.get(rawMatchKey(r.ip, qid)) : null;
      let status = "noMatch";
      if (match) {
        const raw = String(match.vulnStatus || "").toLowerCase();
        status = /fixed|closed/.test(raw) ? "fixed" : "stillOpen";
      }
      return { ...r, rawQid: qid, rawMatch: match, rawStatus: status };
    });
  }, [allRows, rawMap, rawRows]);

  if (!rawRows) {
    return (
      <Card>
        <SectionTitle icon={FileWarning}>Verify against a raw Qualys scan</SectionTitle>
        <p style={{ fontSize: 13, color: C.textSecondary, marginTop: 0, marginBottom: 16, lineHeight: 1.6 }}>
          Upload the native raw Qualys export (IP, QID, Vuln Status, etc.) to check which of the
          currently tracked findings have actually been fixed. Matching is done on <b style={{ color: C.textPrimary }}>IP + QID</b>
          &nbsp;&mdash; the QID is extracted from each finding's Vulnerability ID (format <code>IP/QID</code>) and
          compared against the raw report's native QID column.
        </p>
        <UploadPanel
          compact
          label="Drop the raw Qualys report here"
          canonicalList={RAW_CANONICAL}
          onData={(computed) => setRawRows(computed)}
        />
      </Card>
    );
  }

  const fixedCount = results.filter((r) => r.rawStatus === "fixed").length;
  const stillOpenCount = results.filter((r) => r.rawStatus === "stillOpen").length;
  const noMatchCount = results.filter((r) => r.rawStatus === "noMatch").length;

  const filtered = statusFilter === "all" ? results : results.filter((r) => r.rawStatus === statusFilter);

  const statusBadge = (status) => {
    if (status === "fixed") return <Badge color={C.success} dim={C.successDim}>Fixed</Badge>;
    if (status === "stillOpen") return <Badge color={C.critical} dim={C.criticalDim}>Still open</Badge>;
    return <Badge color={C.textMuted} dim={C.infoDim}>No match</Badge>;
  };

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
        <KpiCard label="Checked findings" value={results.length} icon={FileWarning} />
        <KpiCard label="Confirmed fixed" value={fixedCount} accentColor={C.success} icon={CheckSquare} />
        <KpiCard label="Still open" value={stillOpenCount} accentColor={C.critical} icon={AlertTriangle} />
        <KpiCard label="No match in raw report" value={noMatchCount} sub="Asset/QID not found in the raw file" />
      </div>
      <Card>
        <SectionTitle icon={FileWarning} right={
          <div style={{ display: "flex", gap: 6 }}>
            {[["all", "All"], ["fixed", "Fixed"], ["stillOpen", "Still open"], ["noMatch", "No match"]].map(([k, l]) => (
              <div key={k} onClick={() => setStatusFilter(k)} style={btnStyle(statusFilter === k)}>{l}</div>
            ))}
          </div>
        }>
          Raw scan reconciliation
        </SectionTitle>
        <div style={{ maxHeight: 480, overflowY: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
            <thead style={{ position: "sticky", top: 0, background: C.surface }}>
              <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                {["IP", "QID", "Vulnerability", "Severity", "Tracked status", "Raw report status", "Raw date fixed"].map((h) => (
                  <th key={h} style={{ textAlign: "left", padding: "8px 10px", color: C.textMuted, fontWeight: 600, fontSize: 10.5, textTransform: "uppercase" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.slice(0, 300).map((r, i) => (
                <tr key={i} className="vd-row" style={{ borderBottom: `1px solid ${C.border}` }}>
                  <td style={{ padding: "8px 10px", fontFamily: "'JetBrains Mono', ui-monospace, monospace" }}>{r.ip || "-"}</td>
                  <td style={{ padding: "8px 10px", fontFamily: "'JetBrains Mono', ui-monospace, monospace", color: C.textMuted }}>{r.rawQid || "-"}</td>
                  <td style={{ padding: "8px 10px", maxWidth: 240, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.vulnName || "-"}</td>
                  <td style={{ padding: "8px 10px" }}><Badge color={SEV_META[r.sevNum].color} dim={SEV_META[r.sevNum].dim}>{r.sevLabel}</Badge></td>
                  <td style={{ padding: "8px 10px", color: C.textSecondary }}>{r.vulnStatus || "-"}</td>
                  <td style={{ padding: "8px 10px" }}>{statusBadge(r.rawStatus)}</td>
                  <td style={{ padding: "8px 10px", color: C.textMuted }}>{r.rawMatch && r.rawMatch.dateLastFixed ? String(r.rawMatch.dateLastFixed).slice(0, 10) : "-"}</td>
                </tr>
              ))}
              {!filtered.length && <tr><td colSpan={7} style={{ padding: 20, textAlign: "center", color: C.textMuted }}>No findings match this filter.</td></tr>}
            </tbody>
          </table>
        </div>
        {filtered.length > 300 && <div style={{ fontSize: 11, color: C.textMuted, marginTop: 10 }}>Showing the first 300 of {filtered.length} matches.</div>}
      </Card>
    </div>
  );
}

function MultiSelectDropdown({ label, options, selected, onChange, searchable = false }) {
  const [isOpen, setIsOpen] = useState(false);
  const [search, setSearch] = useState("");
  const ddRef = useRef(null);

  useEffect(() => {
    const handleClick = (e) => { if (ddRef.current && !ddRef.current.contains(e.target)) setIsOpen(false); };
    document.addEventListener("mousedown", handleClick);
    return () => document.removeEventListener("mousedown", handleClick);
  }, []);

  const toggleOption = (opt) => {
    if (selected.includes(opt)) {
      onChange(selected.filter(x => x !== opt));
    } else {
      onChange([...selected, opt]);
    }
  };

  const filteredOptions = searchable 
    ? options.filter(o => String(o).toLowerCase().includes(search.toLowerCase()))
    : options;

  return (
    <div ref={ddRef} style={{ position: "relative", display: "inline-block", zIndex: isOpen ? 9999 : 1 }}>
      <div 
        onClick={() => setIsOpen(!isOpen)} 
        style={{ 
          background: selected.length > 0 ? "rgba(0, 242, 254, 0.12)" : "rgba(255, 255, 255, 0.04)", 
          border: `1px solid ${selected.length > 0 ? "rgba(0, 242, 254, 0.5)" : C.borderLight}`, 
          borderRadius: 8, 
          padding: "7px 12px", fontSize: 12.5, color: selected.length > 0 ? "#00f2fe" : C.textPrimary, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "space-between", minWidth: 145,
          fontWeight: selected.length > 0 ? 600 : 500, transition: "all 0.2s ease",
          boxShadow: selected.length > 0 ? "0 0 12px rgba(0, 242, 254, 0.2)" : "none"
        }}
      >
        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 110 }}>
          {selected.length === 0 ? label : `${selected.length} ${label}`}
        </span>
        <div style={{ display: "flex", alignItems: "center", gap: 4, marginLeft: 6 }}>
          {selected.length > 0 && (
            <span style={{ background: "#00f2fe", color: "#07090e", borderRadius: 10, padding: "1px 5px", fontSize: 10, fontWeight: 800 }}>
              {selected.length}
            </span>
          )}
          <ChevronDown size={13} color={selected.length > 0 ? "#00f2fe" : C.textMuted} style={{ transform: isOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s" }} />
        </div>
      </div>

      {isOpen && (
        <div style={{ 
          position: "absolute", top: "100%", left: 0, marginTop: 6, background: "#111622", 
          border: "1px solid rgba(0, 242, 254, 0.45)", borderRadius: 10, boxShadow: "0 20px 50px rgba(0,0,0,0.95), 0 0 25px rgba(0, 242, 254, 0.25)", 
          zIndex: 99999, minWidth: 230, maxHeight: 320, display: "flex", flexDirection: "column",
          overflow: "hidden", animation: "toastSlideIn 0.2s ease-out"
        }}>
          {searchable && (
            <div style={{ padding: 10, borderBottom: `1px solid ${C.borderLight}`, background: "rgba(255, 255, 255, 0.02)" }}>
              <input 
                value={search} onChange={e => setSearch(e.target.value)}
                placeholder={`Search ${label}...`}
                style={{ width: "100%", background: "#090d16", border: `1px solid ${C.borderLight}`, borderRadius: 6, padding: "7px 10px", fontSize: 12, color: C.textPrimary, outline: "none", boxSizing: "border-box" }}
                onFocus={(e) => e.target.style.borderColor = "#00f2fe"}
                onBlur={(e) => e.target.style.borderColor = C.borderLight}
              />
            </div>
          )}
          <div style={{ overflowY: "auto", padding: "6px 0", maxHeight: 260 }}>
            <div 
              onClick={() => onChange([])}
              style={{ padding: "7px 14px", fontSize: 12.5, color: selected.length === 0 ? "#00f2fe" : C.textSecondary, cursor: "pointer", display: "flex", alignItems: "center", background: selected.length === 0 ? "rgba(0, 242, 254, 0.08)" : "transparent", fontWeight: selected.length === 0 ? 600 : 400 }}
            >
              <div style={{ width: 15, height: 15, border: `1px solid ${selected.length === 0 ? "#00f2fe" : C.borderLight}`, borderRadius: 4, marginRight: 10, display: "flex", alignItems: "center", justifyContent: "center", background: selected.length === 0 ? "#00f2fe" : "transparent", transition: "all 0.2s" }}>
                {selected.length === 0 && <Check size={11} color="#07090e" strokeWidth={3} />}
              </div>
              All ({options.length})
            </div>
            {filteredOptions.map(opt => {
              const isSel = selected.includes(opt);
              return (
                <div 
                  key={opt} onClick={() => toggleOption(opt)}
                  style={{ padding: "7px 14px", fontSize: 12.5, color: isSel ? "#ffffff" : C.textSecondary, cursor: "pointer", display: "flex", alignItems: "center", background: isSel ? "rgba(0, 242, 254, 0.08)" : "transparent", fontWeight: isSel ? 600 : 400 }}
                >
                  <div style={{ width: 15, height: 15, border: `1px solid ${isSel ? "#00f2fe" : C.borderLight}`, borderRadius: 4, marginRight: 10, display: "flex", alignItems: "center", justifyContent: "center", background: isSel ? "#00f2fe" : "transparent", transition: "all 0.2s" }}>
                    {isSel && <Check size={11} color="#07090e" strokeWidth={3} />}
                  </div>
                  <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{opt}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

        <MultiSelectDropdown label="Scan Type" options={filterOptions.scanType || []} selected={filters.scanType || []} onChange={(v) => setFilters(f => ({...f, scanType: v}))} />
        <MultiSelectDropdown label="Risk Rating" options={filterOptions.riskRating || []} selected={filters.riskRating || []} onChange={(v) => setFilters(f => ({...f, riskRating: v}))} />
        <MultiSelectDropdown label="Environment" options={filterOptions.environment || []} selected={filters.environment || []} onChange={(v) => setFilters(f => ({...f, environment: v}))} />
        <MultiSelectDropdown label="CSP" options={filterOptions.csp || []} selected={filters.csp || []} onChange={(v) => setFilters(f => ({...f, csp: v}))} />
        <MultiSelectDropdown label="App Name" options={filterOptions.appName || []} selected={filters.appName || []} onChange={(v) => setFilters(f => ({...f, appName: v}))} searchable />
        <MultiSelectDropdown label="App Owner" options={filterOptions.appOwner || []} selected={filters.appOwner || []} onChange={(v) => setFilters(f => ({...f, appOwner: v}))} searchable />
      </div>
    </div>
  );
}

function CustomDashboardPage({ rows, setRows, setAllRows }) {
  const [filters, setFilters] = useState({
    vulnStatus: [], ifPci: [], slaStatus: [], vulnCategory: [], scanType: [], riskRating: [], environment: [], csp: [], appName: [], appOwner: []
  });
  const [showFollowUpModal, setShowFollowUpModal] = useState(false);
  const [showConfigPrompt, setShowConfigPrompt] = useState(false);
  const [showConfig, setShowConfig] = useState(false);
  const [toast, setToast] = useState(null);
  const [copiedTable, setCopiedTable] = useState(false);
  const [config, setConfig] = useState(() => {
    try { return JSON.parse(localStorage.getItem("vulnOpsMailConfig")) || defaultMailConfig; }
    catch { return defaultMailConfig; }
  });

  const showToast = (msg, type = "success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  const saveConfig = (newCfg) => {
    setConfig(newCfg);
    localStorage.setItem("vulnOpsMailConfig", JSON.stringify(newCfg));
    localStorage.setItem("vulnOpsLinksConfigured", "true");
    showToast("Link configuration updated successfully!");
  };

  const handleOpenFollowUpModal = () => {
    const isConfigured = localStorage.getItem("vulnOpsLinksConfigured") === "true";
    if (!isConfigured) {
      setShowConfigPrompt(true);
    } else {
      setShowFollowUpModal(true);
    }
  };

  const getVulnStatus = (r) => r.vulnStatus || r.raw?.["Vulnerability Status"] || r.raw?.["Vuln Status"] || (r.isOpen ? "Open" : "Closed");
  const getSlaStatus = (r) => r.slaStatus || r.raw?.["SLA Status"] || (r.withinSlaStatus ? r.withinSlaStatus : "Unknown");
  const getIfPci = (r) => r.ifOrPci || r.raw?.["IF or PCI"] || r.ifPciAlt || r.raw?.["IF-PCI"] || "Unknown";
  const getRiskRating = (r) => r.riskRating || r.raw?.["Risk Rating"] || "Unknown";
  const getCategory = (r) => r.vulnCategory || r.raw?.["Vulnerability Category"] || "";
  const getScanType = (r) => r.scanType || r.raw?.["Scan Type"] || "";
  const getEnv = (r) => r.environment || r.raw?.["Environment"] || "";
  const getCsp = (r) => r.csp || r.raw?.["CSP"] || "";
  const getAppName = (r) => r.appName || r.raw?.["Application Name"] || "";
  const getAppOwner = (r) => r.appOwner || r.raw?.["App Owner"] || "";

  // Helper to test if a row matches active filters, optionally excluding one filter key
  const rowMatchesFilters = (r, excludeKey = null) => {
    const matchAttr = (selArr, val) => selArr.length === 0 || selArr.includes(val);

    if (excludeKey !== "vulnStatus" && !matchAttr(filters.vulnStatus, getVulnStatus(r))) return false;
    if (excludeKey !== "ifPci" && !matchAttr(filters.ifPci, getIfPci(r))) return false;
    if (excludeKey !== "slaStatus" && !matchAttr(filters.slaStatus, getSlaStatus(r))) return false;
    if (excludeKey !== "vulnCategory" && !matchAttr(filters.vulnCategory, getCategory(r))) return false;
    if (excludeKey !== "scanType" && !matchAttr(filters.scanType, getScanType(r))) return false;
    if (excludeKey !== "riskRating" && !matchAttr(filters.riskRating, getRiskRating(r))) return false;
    if (excludeKey !== "environment" && !matchAttr(filters.environment, getEnv(r))) return false;
    if (excludeKey !== "csp" && !matchAttr(filters.csp, getCsp(r))) return false;
    if (excludeKey !== "appName" && !matchAttr(filters.appName, getAppName(r))) return false;
    if (excludeKey !== "appOwner" && !matchAttr(filters.appOwner, getAppOwner(r))) return false;

    return true;
  };

  // Dynamic (faceted) filter options: each dropdown shows only valid choices based on other active filters
  const filterOptions = useMemo(() => {
    if (!rows || rows.length === 0) return {};

    const getFacetOpts = (key, getter) => {
      const matchingRows = rows.filter(r => rowMatchesFilters(r, key));
      const vals = Array.from(new Set(matchingRows.map(getter).filter(Boolean))).filter(x => x !== "Unknown");
      return vals.sort();
    };

    return {
      vulnStatus: getFacetOpts("vulnStatus", getVulnStatus),
      ifPci: getFacetOpts("ifPci", getIfPci),
      slaStatus: getFacetOpts("slaStatus", getSlaStatus),
      vulnCategory: getFacetOpts("vulnCategory", getCategory),
      scanType: getFacetOpts("scanType", getScanType),
      riskRating: getFacetOpts("riskRating", getRiskRating),
      environment: getFacetOpts("environment", getEnv),
      csp: getFacetOpts("csp", getCsp),
      appName: getFacetOpts("appName", getAppName),
      appOwner: getFacetOpts("appOwner", getAppOwner)
    };
  }, [rows, filters]);

  const filteredRows = useMemo(() => {
    if (!rows) return [];
    return rows.filter(r => rowMatchesFilters(r));
  }, [rows, filters]);
  // Handle new file upload to replace dataset
  const handleUpload = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const d = new Uint8Array(evt.target.result);
        const wb = XLSX.read(d, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rawJson = XLSX.utils.sheet_to_json(ws, { defval: "" });
        
        const headerMap = buildHeaderMap(Object.keys(rawJson[0] || {}), CANONICAL);
        const processed = rawJson.map(raw => {
          const c = convertRow(raw, headerMap);
          return { ...c, raw, id: Math.random().toString(36).substr(2, 9) };
        });
        
        setRows(processed);
        setAllRows(processed);
        showToast(`Successfully imported ${processed.length} rows.`);
      } catch (err) {
        showToast("Failed to parse file: " + err.message, "warn");
      }
    };
    reader.readAsArrayBuffer(f);
  };

  if (!rows || rows.length === 0) {

          <div style={{ background: "rgba(234, 179, 8, 0.2)", color: "#ca8a04", borderRadius: 8, padding: 8, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>

              Kindly upload the <strong>PowerBI data sheet</strong> (.csv, .xlsx, or .xls) for automated follow-up mail generation and SLA metrics.

            <div style={{ fontSize: 11.5, color: C.textMuted, marginBottom: 6, fontWeight: 600 }}>
              Recognized Header Columns:

            <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
              {["Index", "APM ID", "Application", "Vulnerability", "Vulnerability Age", "Risk Rating", "IF", "PCI", "IF or PCI", "IF-PCI", "Scan Type", "App Owner", "First Found Date", "Due Date", "SLA Status", "Impacted Asset", "Cloud Account Name", "CSP", "Environment", "Recommendation"].map(h => (
                <span key={h} style={{ fontSize: 11, background: "rgba(255,255,255,0.06)", border: `1px solid ${C.borderLight}`, padding: "2px 8px", borderRadius: 4, color: C.textPrimary }}>
                  {h}

            </div>
          </div>
        </div>

        {/* Upload Card */}
        <div style={{ padding: "44px 32px", textAlign: "center", color: C.textSecondary, background: `linear-gradient(135deg, ${C.surface}, ${C.bgElevated})`, border: `1px solid ${C.border}`, borderRadius: 16, boxShadow: "0 12px 36px rgba(0,0,0,0.25)" }}>
          <div style={{ marginBottom: 20, display: "inline-flex", padding: 16, background: "rgba(59, 130, 246, 0.1)", borderRadius: "50%", border: "1px solid rgba(59, 130, 246, 0.2)" }}>

          </div>
          <h2 style={{ fontSize: 24, fontWeight: 700, color: C.textPrimary, marginBottom: 8 }}>Follow-Up Mail Intelligence Engine</h2>
          <p style={{ fontSize: 13.5, color: C.textMuted, marginBottom: 28, maxWidth: 520, margin: "0 auto 28px auto", lineHeight: 1.6 }}>
            Upload your weekly PowerBI export spreadsheet to automatically generate compliant Outlook follow-up emails, SLA status gauges, and scan-type breakdowns.
          </p>

          <label style={{ ...btnStyle(true), padding: "14px 28px", fontSize: 15, borderRadius: 10, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 10, background: `linear-gradient(135deg, ${C.accent}, #1d4ed8)`, border: "none", boxShadow: "0 4px 18px rgba(59, 130, 246, 0.4)", fontWeight: 600 }}>
            <Upload size={18} />
            <span>Upload PowerBI Data Sheet</span>
            <input type="file" accept=".csv,.xlsx,.xls" onChange={handleUpload} style={{ display: "none" }} />
          </label>

          <div style={{ marginTop: 32, paddingTop: 24, borderTop: `1px solid ${C.borderLight}`, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, textAlign: "left" }}>
            <div style={{ padding: "10px 14px", background: C.surfaceHover, borderRadius: 8, border: `1px solid ${C.borderLight}` }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.textPrimary, marginBottom: 2 }}>1. Filter Data</div>
              <div style={{ fontSize: 11, color: C.textMuted }}>Slice by APM ID, IF/PCI, Scan Type, or Owner</div>
            </div>
            <div style={{ padding: "10px 14px", background: C.surfaceHover, borderRadius: 8, border: `1px solid ${C.borderLight}` }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.textPrimary, marginBottom: 2 }}>2. Preview Charts</div>
              <div style={{ fontSize: 11, color: C.textMuted }}>Visual scan distribution & SLA donut</div>
            </div>
            <div style={{ padding: "10px 14px", background: C.surfaceHover, borderRadius: 8, border: `1px solid ${C.borderLight}` }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.textPrimary, marginBottom: 2 }}>3. 1-Click Outlook</div>
              <div style={{ fontSize: 11, color: C.textMuted }}>Copy & paste directly with zero format loss</div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  const riskCounts = filteredRows.reduce((acc, r) => {
    const v = getRiskRating(r) || "None";
    acc[v] = (acc[v] || 0) + 1;
    return acc;
  }, {});
  
  const riskData = Object.keys(riskCounts).map(k => ({ name: k, value: riskCounts[k] }));

  const slaCounts = filteredRows.reduce((acc, r) => {
    const v = getSlaStatus(r) || "None";
    acc[v] = (acc[v] || 0) + 1;
    return acc;
  }, {});
  const slaData = Object.keys(slaCounts).map(k => ({ name: k, value: slaCounts[k] }));

  // New Insights Calculations
  const activeRows = filteredRows.filter(r => r.isOpen);
  
  const vulnCounts = {};
  activeRows.forEach(r => {
    const title = r.vulnName || r.raw?.["Title"] || r.raw?.["Vulnerability Name"] || "Unknown";
    vulnCounts[title] = (vulnCounts[title] || 0) + 1;
  });
  const topVulns = Object.keys(vulnCounts).map(k => ({ title: k, count: vulnCounts[k] })).sort((a,b) => b.count - a.count).slice(0, 5);

  const assetCounts = {};
  activeRows.forEach(r => {
    const asset = r.impactedAsset || r.ip || r.fqdn || r.dns || "Unknown Asset";
    assetCounts[asset] = (assetCounts[asset] || 0) + 1;
  });
  const topAssets = Object.keys(assetCounts).map(k => ({ asset: k, count: assetCounts[k] })).sort((a,b) => b.count - a.count).slice(0, 5);

  const oldestVulns = [...activeRows].filter(r => r.ageDays > 0).sort((a,b) => b.ageDays - a.ageDays).slice(0, 5);

  const appStats = {};
  activeRows.forEach(r => {
    const app = r.appName || r.raw?.["Application Name"] || r.raw?.["Application"] || "Unknown App";
    const st = r.scanType || r.category || r.raw?.["Scan Type"] || "General Scan";
    if (!appStats[app]) appStats[app] = { total: 0, pastDue: 0, withinSla: 0, criticalHigh: 0, scanTypes: {} };
    appStats[app].total++;
    if (r.withinSlaStatus === "Past due SLA") appStats[app].pastDue++;
    else if (r.withinSlaStatus === "Within SLA") appStats[app].withinSla++;
    if (r.sevNum === 5 || r.sevNum === 4) appStats[app].criticalHigh++;
    appStats[app].scanTypes[st] = (appStats[app].scanTypes[st] || 0) + 1;
  });
  const appTableRows = Object.keys(appStats).map(app => {
    const stEntries = Object.entries(appStats[app].scanTypes).sort((a,b) => b[1] - a[1]);
    const scanTypesSummary = stEntries.map(([st, cnt]) => `${st}: ${cnt}`).join(", ");
    return {
      app,
      ...appStats[app],
      stEntries,

  return (
    <div>

      <div style={{ background: "linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(14, 165, 233, 0.04))", border: `1px solid ${C.borderLight}`, borderRadius: 10, padding: "12px 18px", marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

}


function App() {
  const [allRows, setAllRows] = useState(null);
  const [prevRows, setPrevRows] = useState(null);
  const [rawRows, setRawRows] = useState(null);
  const [fileName, setFileName] = useState("");
  const [matchInfo, setMatchInfo] = useState(null);
  const [page, setPage] = useState("overview");
  const [selectedVuln, setSelectedVuln] = useState(null);
  const [filters, setFilters] = useState({ severity: "all", vulnStatus: "all", infra: "all", slaStatus: "all", search: "", csp: "all", ifPci: "all", appName: "" });

  const handleData = (computed, name, matched, total) => {
    const filtered = computed.filter((r) => r.sevNum >= 3);
    setAllRows(filtered);
    setFileName(name);
    setMatchInfo({ matched, total });
    setPage("overview");
  };

  const infraOptions = useMemo(() => (allRows ? Array.from(new Set(allRows.map((r) => r.infra))).sort() : []), [allRows]);
  const cspOptions = useMemo(() => (allRows ? uniqueVals(allRows, "cspVal") : []), [allRows]);
  const ifPciOptions = useMemo(() => (allRows ? uniqueVals(allRows, "ifOrPciVal") : []), [allRows]);
  const appNameOptions = useMemo(() => (allRows ? uniqueVals(allRows, "appNameVal") : []), [allRows]);

  const vulnStatusOptions = useMemo(() => {
    if (!allRows) return [];
    const rawSet = new Set();
    allRows.forEach((r) => {
      const s = r.vulnStatus || (r.isOpen ? "Active" : "Fixed");
      if (s && s !== "-") rawSet.add(s.trim());
    });
    const list = Array.from(rawSet).filter(Boolean).sort();
    return list.length ? list : ["Active", "Reopened", "Fixed"];
  }, [allRows]);

  const filteredRows = useMemo(() => {
    if (!allRows) return [];
    return allRows.filter((r) => {
      if (filters.severity !== "all" && r.sevNum !== filters.severity) return false;
      if (filters.vulnStatus && filters.vulnStatus !== "all") {
        const vStat = String(r.vulnStatus || (r.isOpen ? "Active" : "Fixed")).trim().toLowerCase();
        const target = String(filters.vulnStatus).trim().toLowerCase();
        if (target === "active" || target === "open") {
          if (!r.isOpen && !vStat.includes("active") && !vStat.includes("open")) return false;
        } else if (target === "reopened" || target === "re-opened") {
          if (!vStat.includes("reopen") && !vStat.includes("re-open")) return false;
        } else if (target === "fixed" || target === "closed") {
          if (r.isOpen && !vStat.includes("fix") && !vStat.includes("close")) return false;
        } else if (target === "new") {
          if (!vStat.includes("new")) return false;
        } else {
          if (vStat !== target) return false;
        }
      }
      if (filters.infra !== "all" && r.infra !== filters.infra) return false;
      if (filters.slaStatus === "breached" && !r.breached) return false;
      if (filters.slaStatus === "within" && (r.breached || !r.isOpen)) return false;
      if (filters.csp !== "all" && r.cspVal !== filters.csp) return false;
      if (filters.ifPci !== "all" && r.ifOrPciVal !== filters.ifPci) return false;
      if (filters.appName && !r.appNameVal.toLowerCase().includes(filters.appName.toLowerCase())) return false;
      if (filters.search) {
        const s = filters.search.toLowerCase();
        const hay = `${r.ip} ${r.dns} ${r.fqdn} ${r.vulnName} ${r.cveId} ${r.assetKey}`.toLowerCase();
        if (!hay.includes(s)) return false;
      }
      return true;
    });
  }, [allRows, filters]);

  const kpi = useMemo(() => {
    const open = filteredRows.filter((r) => r.isOpen);
    const withAge = open.filter((r) => r.ageDays !== null);
    const breached = open.filter((r) => r.breached).length;
    return {
      totalAssets: new Set(open.map((r) => r.assetKey)).size,
      totalOpen: open.length,
      sev5: open.filter((r) => r.sevNum === 5).length,
      sev4: open.filter((r) => r.sevNum === 4).length,
      sev3: open.filter((r) => r.sevNum === 3).length,
      slaBreached: breached,
      slaCompliance: open.length ? Math.round(((open.length - breached) / open.length) * 100) : 100,
      avgAge: withAge.length ? Math.round(withAge.reduce((s, r) => s + r.ageDays, 0) / withAge.length) : 0,
    };
  }, [filteredRows]);

  const posture = useMemo(() => computePosture(kpi), [kpi]);
  const infraAgg = useMemo(() => buildInfraAgg(filteredRows), [filteredRows]);

  const ageingHeat = useMemo(() => {
    const out = { 5: {}, 4: {}, 3: {} };
    const open = filteredRows.filter((r) => r.isOpen && r.ageDays !== null && [5, 4, 3].includes(r.sevNum));
    AGE_BUCKETS.forEach((b) => {
      [5, 4, 3].forEach((s) => {
        out[s][b.label] = open.filter((r) => r.sevNum === s && r.ageDays >= b.min && r.ageDays <= b.max).length;
      });
    });
    return out;
  }, [filteredRows]);

  const dataQuality = useMemo(() => {
    if (!allRows) return { total: 0, missingSeverity: 0, missingDates: 0, duplicates: 0 };
    const idCounts = new Map();
    allRows.forEach((r) => {
      const id = r.uniqueId || r.vulnId;
      if (id) idCounts.set(id, (idCounts.get(id) || 0) + 1);
    });
    let dup = 0;
    idCounts.forEach((c) => { if (c > 1) dup += c - 1; });
    return {
      total: allRows.length,
      missingSeverity: allRows.filter((r) => !r.hasSeverityData).length,
      missingDates: allRows.filter((r) => !r.hasDateData).length,
      duplicates: dup,
    };
  }, [allRows]);

  if (!allRows) {
    return (
      <div style={{ background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter, -apple-system, system-ui, sans-serif", padding: "32px 20px" }}>
        <div style={{ width: "100%", maxWidth: 940 }}>
          <div style={{ textAlign: "center", marginBottom: 36 }}>
            <div style={{ display: "inline-flex", padding: 14, background: C.accentDim, borderRadius: 16, border: `1px solid ${C.accent}40`, marginBottom: 14 }}>
              <ShieldCheck size={40} color={C.accent} />
            </div>
            <h1 style={{ fontSize: 28, fontWeight: 800, color: C.textPrimary, margin: "0 0 8px", letterSpacing: -0.5 }}>
              VulnOps Intelligence & Mail Engine
            </h1>
            <p style={{ fontSize: 14, color: C.textSecondary, margin: "0 auto", maxWidth: 560, lineHeight: 1.5 }}>
              Unified security vulnerability workspace. Choose your operational workflow below to upload the corresponding data sheet and initialize analytics.
            </p>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(380px, 1fr))", gap: 24, marginBottom: 24 }}>
            {/* Option 1: Metrics Data / App Related Files */}
            <div style={{
              background: `linear-gradient(160deg, ${C.surface}, ${C.bgElevated})`,
              border: `1.5px solid ${C.borderLight}`,
              borderRadius: 16,
              padding: 24,
              display: "flex",
              flexDirection: "column",
              boxShadow: "0 10px 30px rgba(0,0,0,0.35)",
              position: "relative"
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
                <div style={{ padding: 10, borderRadius: 10, background: "rgba(99, 102, 241, 0.15)", color: C.accent }}>
                  <LayoutDashboard size={24} />
                </div>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: C.textPrimary }}>Metrics Data Analysis</div>
                  <div style={{ fontSize: 12, color: C.textMuted }}>App-related vulnerability exports (Qualys)</div>
                </div>
              </div>

              <p style={{ fontSize: 12.5, color: C.textSecondary, lineHeight: 1.5, marginBottom: 18, flexGrow: 1 }}>
                Upload <strong>App related raw vulnerability reports</strong> to unlock complete asset posture, ageing heatmaps, SLA breach metrics, and top-risk host directories.
              </p>

              <UploadPanel
                onData={handleData}
                compact={true}
                label="Drop App Related File / Qualys Export"
              />

              <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: C.textMuted }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: C.accent }} />
                <span>Navigates directly to <strong>Executive Overview & Metrics</strong></span>
              </div>
            </div>

            {/* Option 2: Follow-up Mail / PowerBI File */}
            <div style={{
              background: `linear-gradient(160deg, rgba(234, 179, 8, 0.06), ${C.bgElevated})`,
              border: "1.5px solid rgba(234, 179, 8, 0.35)",
              borderRadius: 16,
              padding: 24,
              display: "flex",
              flexDirection: "column",
              boxShadow: "0 10px 30px rgba(0,0,0,0.35)",
              position: "relative"
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
                <div style={{ padding: 10, borderRadius: 10, background: "rgba(234, 179, 8, 0.15)", color: "#facc15" }}>
                  <Sparkles size={24} />
                </div>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: C.textPrimary }}>Follow-Up Mail Generator</div>
                  <div style={{ fontSize: 12, color: "#eab308" }}>PowerBI data sheet integration</div>
                </div>
              </div>

              <p style={{ fontSize: 12.5, color: C.textSecondary, lineHeight: 1.5, marginBottom: 18, flexGrow: 1 }}>
                Directly upload your <strong>Qualys PowerBI Master Consolidated Sheet</strong> to run one-click automated email dispatch, engineer grouping, and preview follow-up notifications.
              </p>

              <UploadPanel
                onData={(computed, name, matched, total) => {
                  handleData(computed, name, matched, total);
                  setPage("followMail");
                }}
                compact={true}
                label="Drop PowerBI File / Master Sheet"
              />

              <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: C.textMuted }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#facc15" }} />
                <span>Navigates directly to <strong>Follow Mail Automation</strong></span>
              </div>
            </div>
          </div>

          <div style={{ textAlign: "center", fontSize: 11.5, color: C.textMuted }}>
            All files are parsed locally and privately in your browser. Original files remain untouched.
            <div style={{ marginTop: 6, fontSize: 10.5, opacity: 0.75 }}>Built by Barathraj V</div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", background: C.bg, minHeight: 640, fontFamily: "Inter, -apple-system, system-ui, sans-serif" }}>
      <style>{`
        .vd-row { transition: background .12s ease; }
        .vd-row:hover { background: ${C.surfaceHover} !important; }
        .vd-nav { transition: background .12s ease, color .12s ease; }
        .vd-nav:hover { background: ${C.surfaceHover}; color: ${C.textPrimary}; }
        .vd-card { transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .vd-card:hover { border-color: ${C.borderLight}; box-shadow: 0 6px 20px rgba(0,0,0,0.28); transform: translateY(-1px); }
        select.vd-select option { background: ${C.surface}; color: ${C.textPrimary}; }
        input, select { transition: border-color .12s ease, box-shadow .12s ease; }
        input:focus, select:focus { outline: none; border-color: ${C.accent} !important; box-shadow: 0 0 0 3px ${C.accentDim}; }
      `}</style>
      <Sidebar page={page} setPage={setPage} fileName={fileName} rowCount={allRows.length} onReset={() => { setAllRows(null); setPrevRows(null); setRawRows(null); }} />
      <div style={{ flex: 1, padding: 24, minWidth: 0, overflowX: "hidden" }}>

          <div style={{ marginBottom: 16, fontSize: 12, color: C.medium, background: C.mediumDim, padding: "8px 12px", borderRadius: 7 }}>

        {page !== "compare" && page !== "rawVerify" && page !== "customDashboard" && (

            filteredCount={filteredRows ? filteredRows.length : 0}
          />

        {page === "overview" && <OverviewPage rows={filteredRows} kpi={kpi} posture={posture} infraAgg={infraAgg} ageingHeat={ageingHeat} dataQuality={dataQuality} />}

        {page === "applications" && <ApplicationsPage rows={filteredRows} />}

        {page === "infra" && <InfraPage infraAgg={infraAgg} />}
        {page === "keyTables" && <KeyTablesPage rows={filteredRows} allRows={allRows} />}
        {page === "customDashboard" && <CustomDashboardPage rows={allRows} setRows={setAllRows} setAllRows={setAllRows} />}
        {page === "all" && <AllVulnPage rows={filteredRows} onSelect={setSelectedVuln} />}
        {page === "compare" && <ComparePage rows={allRows} prevRows={prevRows} setPrevRows={setPrevRows} />}
        {page === "rawVerify" && <RawVerifyPage allRows={allRows} rawRows={rawRows} setRawRows={setRawRows} />}
      </div>
      <VulnDetailPanel vuln={selectedVuln} onClose={() => setSelectedVuln(null)} />
      <div style={{ position: "fixed", right: 14, bottom: 10, fontSize: 10, color: C.textMuted, opacity: 0.55, letterSpacing: 0.3, pointerEvents: "none", zIndex: 5 }}>
        Built by IVM Team (Barath &amp; Dhinakaran)
      </div>
    </div>
  );
}

/* ------------------------------ mount ------------------------------ */
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);

</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<script>
(function () {
  var mounted = false;

  function showError(title, err) {
    if (mounted) return;
    var loader = document.getElementById("boot-loader");
    var titleEl = document.getElementById("boot-title");
    var box = document.getElementById("boot-error");
    var retry = document.getElementById("boot-retry");
    if (titleEl) titleEl.textContent = title;
    if (box) {
      box.style.display = "block";
      var name = (err && err.name) || "Error";
      var msg = (err && err.message) || (typeof err === "string" ? err : "Unknown error");
      var stack = (err && err.stack) || "";
      box.textContent = name + ": " + msg + (stack ? "\n\n" + stack : "");
    }
    if (retry) retry.style.display = "inline-block";
    if (loader) loader.className = "vd-show";
  }

  window.addEventListener("error", function (e) {
    if (!mounted) showError("Failed to load the dashboard", e.error || new Error(e.message || "Unknown script error"));
  });

  function boot() {
    try {
      if (typeof React === "undefined") throw new Error("React failed to load from CDN. Check your internet connection and try again.");
      if (typeof ReactDOM === "undefined") throw new Error("ReactDOM failed to load from CDN.");
      if (typeof Recharts === "undefined") throw new Error("Recharts failed to load from CDN.");
      if (typeof XLSX === "undefined") throw new Error("XLSX (SheetJS) failed to load from CDN.");
      if (typeof Babel === "undefined") throw new Error("Babel standalone failed to load from CDN.");

      var sourceEl = document.getElementById("app-source");
      var source = sourceEl.textContent;

      var compiled;
      try {
        compiled = Babel.transform(source, { presets: ["react"], filename: "app.jsx", sourceType: "script" }).code;
      } catch (compileErr) {
        var e1 = new Error("JSX compile error: " + (compileErr.message || compileErr));
        e1.stack = compileErr.stack || e1.stack;
        throw e1;
      }

      var runner;
      try {
        runner = new Function("React", "ReactDOM", "Recharts", compiled);
      } catch (buildErr) {
        var e2 = new Error("Compiled script has invalid syntax: " + (buildErr.message || buildErr));
        e2.stack = buildErr.stack || e2.stack;
        throw e2;
      }

      try {
        runner(React, ReactDOM, Recharts);
      } catch (runErr) {
        var e3 = new Error("Dashboard crashed while starting: " + (runErr.message || runErr));
        e3.stack = runErr.stack || e3.stack;
        throw e3;
      }

      mounted = true;
    } catch (err) {
      showError("Failed to start the dashboard", err);
    }
  }

  boot();
})();
</script>

</body>
</html>
