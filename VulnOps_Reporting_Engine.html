<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VulnOps · Weekly Vulnerability Reporting Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0B0D12;
  --bg-grid: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
  --surface:#12141b;
  --surface-2:#191c25;
  --surface-3:#20242f;
  --border:#262a35;
  --border-strong:#343a48;
  --text:#eef0f4;
  --text-dim:#96a0b0;
  --text-faint:#616b7a;
  --accent:#E1122C;
  --accent-dim:#3a1017;
  --accent-glow: rgba(225,18,44,0.38);
  --crit:#B3001F;
  --high:#F0590B;
  --med:#F5A800;
  --ok:#22C766;
  --danger:#E1122C;
  --aws:#FF9900;
  --azure:#0E8AE0;
  --onprem:#9B6BFF;
  --radius: 10px;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter', -apple-system, sans-serif;
  --disp: 'Space Grotesk', 'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(180deg, rgba(225,18,44,0.07), transparent 340px),
    radial-gradient(circle at 85% 0%, rgba(14,138,224,0.06), transparent 40%),
    var(--bg-grid),
    var(--bg);
  background-size: auto, auto, 22px 22px, auto;
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
::selection{ background: var(--accent); color:#fff; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:#4a5264; }

a{ color: var(--accent); }
button{ font-family:var(--sans); cursor:pointer; }
input,select,textarea{ font-family:var(--sans); }

.app-shell{ display:flex; min-height:100vh; }

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px; flex-shrink:0; background:linear-gradient(180deg,#151821,#0a0c11);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  padding:20px 14px; position:sticky; top:0; height:100vh;
}
.brand{ display:flex; align-items:center; gap:10px; padding:4px 6px 20px 6px; }
.brand-mark{
  width:34px; height:34px; border-radius:9px; flex-shrink:0;
  background: conic-gradient(from 220deg, var(--accent), #7A0A16, var(--accent));
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 0 22px var(--accent-glow);
  font-family:var(--disp); font-weight:700; color:#fff; font-size:15px;
}
.brand-text{ line-height:1.15; }
.brand-text .t1{ font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:0.2px; }
.brand-text .t2{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1.2px; margin-top:2px; }

.nav{ display:flex; flex-direction:column; gap:3px; margin-top:6px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:8px;
  color:var(--text-dim); font-size:13px; font-weight:500; border:1px solid transparent; border-left:2px solid transparent;
  background:transparent; text-align:left; width:100%; transition:all .14s ease; position:relative;
}
.nav-item .ico{ width:16px; height:16px; flex-shrink:0; opacity:0.85; transition:transform .16s ease; }
.nav-item:hover{ background:var(--surface-2); color:var(--text); transform:translateX(2px); }
.nav-item:hover .ico{ transform:scale(1.1); }
.nav-item.active{ background:var(--surface-3); color:#FF4D6A; border-color:var(--border-strong); border-left:2px solid var(--accent); }
.nav-item .n-badge{
  margin-left:auto; font-family:var(--mono); font-size:10px; background:var(--surface-3);
  color:var(--text-dim); padding:1px 6px; border-radius:20px; border:1px solid var(--border-strong);
}
.nav-item.active .n-badge{ background:var(--accent-dim); color:#FF4D6A; border-color:var(--accent-dim); }

.nav-section-label{ font-size:10px; text-transform:uppercase; letter-spacing:1.4px; color:var(--text-faint); margin:16px 8px 6px; }

.sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); }
.report-date-mini{ font-family:var(--mono); font-size:11px; color:var(--text-dim); padding:4px 6px; }
.credit{ font-size:10px; color:var(--text-faint); padding:6px 6px 0; letter-spacing:0.3px; }

/* ---------- Main ---------- */
.main{ flex:1; min-width:0; padding:26px 34px 60px; max-width:1400px; }
.pagehead{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px;}
.pagehead h1{ font-family:var(--disp); font-size:23px; margin:0 0 4px; font-weight:700; letter-spacing:0.2px;}
.pagehead p{ margin:0; color:var(--text-dim); font-size:13px; max-width:640px; }
.eyebrow{ font-family:var(--mono); font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:2px; margin-bottom:6px; display:block;}

.card{
  background: linear-gradient(180deg, var(--surface), var(--surface) 60%, #0d0f15);
  border:1px solid var(--border); border-radius:var(--radius); padding:20px;
}
.card + .card{ margin-top:16px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.card-title{ font-family:var(--disp); font-weight:600; font-size:14.5px; }
.card-sub{ color:var(--text-faint); font-size:12px; margin-top:2px; }

.grid{ display:grid; gap:16px; }
.grid-2{ grid-template-columns:1fr 1fr; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:1050px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }

/* buttons */
.btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:8px; font-size:13px; font-weight:600;
  border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text); transition:transform .12s ease, filter .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease; }
.btn:hover{ border-color:#4a5264; background:var(--surface-3); transform:translateY(-1px); }
.btn:active{ transform:translateY(0) scale(0.97); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none !important; }
.btn-primary{ background:linear-gradient(180deg, #F5324E, var(--accent)); color:#fff; border-color:transparent; box-shadow:0 0 0 1px rgba(225,18,44,0.2), 0 8px 20px -8px var(--accent-glow); }
.btn-primary:hover{ filter:brightness(1.08); box-shadow:0 0 0 1px rgba(225,18,44,0.28), 0 10px 24px -8px var(--accent-glow); }
.btn-ghost{ background:transparent; border-color:var(--border); color:var(--text-dim); }
.btn-ghost:hover{ color:var(--text); border-color:var(--border-strong); }
.btn-sm{ padding:6px 10px; font-size:12px; border-radius:6px; }
.btn-danger{ background:transparent; border-color:rgba(225,18,44,0.4); color:var(--danger); }
.btn-danger:hover{ background:rgba(225,18,44,0.1); border-color:rgba(225,18,44,0.6); }
.btn-success{ background:linear-gradient(180deg, #2FDE86, var(--ok)); color:#042313; border-color:transparent; box-shadow:0 0 0 1px rgba(34,199,102,0.2), 0 8px 20px -8px rgba(34,199,102,0.4); }
.btn-success:hover{ filter:brightness(1.08); }
.btn-info{ background:linear-gradient(180deg, #35A9F7, var(--azure)); color:#fff; border-color:transparent; box-shadow:0 0 0 1px rgba(14,138,224,0.2), 0 8px 20px -8px rgba(14,138,224,0.4); }
.btn-info:hover{ filter:brightness(1.08); }
.btn-warn{ background:linear-gradient(180deg, #FFC53D, var(--med)); color:#3a2600; border-color:transparent; box-shadow:0 0 0 1px rgba(245,168,0,0.25), 0 8px 20px -8px rgba(245,168,0,0.4); }
.btn-warn:hover{ filter:brightness(1.06); }
.btn-refresh{ background:var(--surface-2); border-color:rgba(14,138,224,0.4); color:#4FB4F5; }
.btn-refresh:hover{ background:rgba(14,138,224,0.1); border-color:rgba(14,138,224,0.65); color:#6FC6FF; }
.btn-refresh .ico{ transition:transform .35s ease; }
.btn-refresh:hover .ico{ transform:rotate(140deg); }
.btn-icon{ padding:8px; }

/* upload cards */
.upload-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
@media (max-width:900px){ .upload-grid{ grid-template-columns:1fr; } }
.upload-card{
  border:1.5px dashed var(--border-strong); border-radius:var(--radius); padding:18px; position:relative;
  background:var(--surface); transition:border-color .15s ease;
}
.upload-card.filled{ border-style:solid; border-color:var(--accent-dim); background:linear-gradient(180deg, rgba(225,18,44,0.06), var(--surface) 40%); }
.upload-card .stage-no{ font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:1px; }
.upload-card h3{ font-family:var(--disp); font-size:15px; margin:4px 0 2px; }
.upload-card .req{ font-size:11.5px; color:var(--text-faint); margin-bottom:12px; }
.dropzone{ border:1px solid var(--border); border-radius:8px; padding:16px; text-align:center; background:var(--surface-2); }
.dropzone input{ display:none; }
.dropzone label{ cursor:pointer; color:var(--accent); font-weight:600; font-size:12.5px; }
.file-meta{ margin-top:12px; font-family:var(--mono); font-size:11.5px; color:var(--text-dim); line-height:1.9; }
.file-meta .row{ display:flex; justify-content:space-between; gap:10px; }
.file-meta .ok{ color:var(--ok); }
.file-meta .warn{ color:var(--med); }
.chip-row{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.mini-chip{ font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:20px; background:var(--surface-3); border:1px solid var(--border-strong); color:var(--text-dim); }

/* pipeline rail - signature element */
.pipeline-rail{ display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:6px 0 10px; }
.stage-block{ flex:1; min-width:128px; position:relative; padding:16px 14px; border:1px solid var(--border); background:var(--surface-2); }
.stage-block:first-child{ border-top-left-radius:var(--radius); border-bottom-left-radius:var(--radius); }
.stage-block:last-child{ border-top-right-radius:var(--radius); border-bottom-right-radius:var(--radius); }
.stage-block + .stage-block{ border-left:none; }
.stage-block.done{ background:linear-gradient(180deg, rgba(225,18,44,0.10), var(--surface-2)); }
.stage-block .sno{ font-family:var(--mono); font-size:10px; color:var(--text-faint); }
.stage-block.done .sno{ color:var(--accent); }
.stage-block .slabel{ font-size:11.5px; font-weight:600; margin-top:5px; color:var(--text-dim); }
.stage-block.done .slabel{ color:var(--text); }
.stage-block .sval{ font-family:var(--mono); font-size:19px; font-weight:600; margin-top:8px; color:var(--text-faint); }
.stage-block.done .sval{ color:var(--accent); }
.stage-arrow{ display:flex; align-items:center; color:var(--border-strong); padding:0 2px; font-size:14px; }
.stage-block.done + .stage-arrow{ color:var(--accent-dim); }

/* stat cards */
.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; position:relative; overflow:hidden; transition:transform .16s ease, box-shadow .16s ease; }
.stat-card:hover{ transform:translateY(-2px); box-shadow:0 10px 22px -12px rgba(0,0,0,0.5); }
.stat-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; background:transparent; }
.stat-card .lbl{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; }
.stat-card .val{ font-family:var(--disp); font-size:26px; font-weight:700; margin-top:6px; }
.stat-card .sub{ font-size:11.5px; color:var(--text-dim); margin-top:4px; }
.stat-card.accent{ background:linear-gradient(160deg, rgba(225,18,44,0.12), var(--surface) 65%); border-color:rgba(225,18,44,0.28); }
.stat-card.accent::before{ background:var(--accent); }
.stat-card.accent .val{ color:#FF4D6A; }
.stat-card.crit{ background:linear-gradient(160deg, rgba(179,0,31,0.14), var(--surface) 65%); border-color:rgba(179,0,31,0.3); }
.stat-card.crit::before{ background:var(--crit); }
.stat-card.crit .val{ color:#FF4D6A; }
.stat-card.high{ background:linear-gradient(160deg, rgba(240,89,11,0.13), var(--surface) 65%); border-color:rgba(240,89,11,0.28); }
.stat-card.high::before{ background:var(--high); }
.stat-card.high .val{ color:var(--high); }
.stat-card.med{ background:linear-gradient(160deg, rgba(245,168,0,0.13), var(--surface) 65%); border-color:rgba(245,168,0,0.28); }
.stat-card.med::before{ background:var(--med); }
.stat-card.med .val{ color:var(--med); }
.stat-card.ok{ background:linear-gradient(160deg, rgba(34,199,102,0.13), var(--surface) 65%); border-color:rgba(34,199,102,0.28); }
.stat-card.ok::before{ background:var(--ok); }
.stat-card.ok .val{ color:var(--ok); }
.stat-card.danger{ background:linear-gradient(160deg, rgba(225,18,44,0.14), var(--surface) 65%); border-color:rgba(225,18,44,0.3); }
.stat-card.danger::before{ background:var(--danger); }
.stat-card.danger .val{ color:#FF4D6A; }

/* tables */
.table-scroll{ overflow:auto; border:1px solid var(--border); border-radius:var(--radius); }
table.data{ border-collapse:collapse; width:100%; font-size:12.5px; }
table.data thead th{
  position:sticky; top:0; background:#171a22; text-align:left; padding:9px 12px; font-size:10.5px;
  text-transform:uppercase; letter-spacing:0.6px; color:var(--text-faint); border-bottom:1px solid var(--border-strong); white-space:nowrap;
}
table.data tbody td{ padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; font-family:var(--mono); color:var(--text-dim); }
table.data tbody tr:hover{ background:var(--surface-2); }
table.data tbody tr:last-child td{ border-bottom:none; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600; font-family:var(--mono); border:1px solid; }
.badge-crit{ color:#FF4D6A; border-color:rgba(179,0,31,0.45); background:rgba(179,0,31,0.16); }
.badge-high{ color:var(--high); border-color:rgba(240,89,11,0.4); background:rgba(240,89,11,0.13); }
.badge-med{ color:var(--med); border-color:rgba(245,168,0,0.4); background:rgba(245,168,0,0.14); }
.badge-ok{ color:var(--ok); border-color:rgba(34,199,102,0.4); background:rgba(34,199,102,0.12); }
.badge-danger{ color:#FF4D6A; border-color:rgba(225,18,44,0.4); background:rgba(225,18,44,0.13); }
.badge-aws{ color:var(--aws); border-color:rgba(255,153,0,0.4); background:rgba(255,153,0,0.12); }
.badge-azure{ color:#4FB4F5; border-color:rgba(14,138,224,0.4); background:rgba(14,138,224,0.13); }
.badge-info{ color:#4FB4F5; border-color:rgba(14,138,224,0.4); background:rgba(14,138,224,0.13); }
.badge-neutral{ color:var(--text-dim); border-color:var(--border-strong); background:var(--surface-3); }

/* form bits */
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; font-weight:600; }
.field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:7px; padding:8px 10px;
  color:var(--text); font-size:12.5px; font-family:var(--mono);
}
.field textarea{ font-family:var(--mono); min-height:160px; resize:vertical; }
.inline-fields{ display:flex; gap:10px; }
.inline-fields .field{ flex:1; }

.config-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.config-table th{ text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--text-faint); padding:6px 8px; letter-spacing:0.5px; border-bottom:1px solid var(--border-strong); }

/* Mode and Tool Selectors */
.mode-selector-container {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
}
.mode-selector-title {
  font-family: var(--disp);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-dim);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (max-width: 650px) {
  .mode-tabs { grid-template-columns: 1fr; }
}
.mode-card {
  border: 1.5px solid var(--border);
  background: var(--surface-2);
  border-radius: 9px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all .18s ease;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.mode-card:hover {
  border-color: var(--border-strong);
  background: var(--surface-3);
  transform: translateY(-1px);
}
.mode-card.active {
  border-color: var(--accent);
  background: linear-gradient(145deg, rgba(225,18,44,0.12), var(--surface-2));
  box-shadow: 0 0 16px -4px rgba(225,18,44,0.3);
}
.mode-card-icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}
.mode-card.active .mode-card-icon {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.mode-card-title {
  font-family: var(--disp);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
}
.mode-card-desc {
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.4;
}

/* Tool Selector Grid */
.tool-selector-container {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 22px;
}
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}
.tool-card {
  border: 1.5px solid var(--border);
  background: var(--surface-2);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: all .15s ease;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
}
.tool-card:hover {
  border-color: var(--border-strong);
  background: var(--surface-3);
  transform: translateY(-2px);
}
.tool-card.active {
  border-color: var(--accent);
  background: linear-gradient(160deg, rgba(225,18,44,0.16), var(--surface-2));
  box-shadow: 0 4px 12px -2px rgba(225,18,44,0.35);
}
.tool-name {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);
}
.tool-card.active .tool-name {
  color: #FF4D6A;
}
.tool-status-tag {
  font-family: var(--mono);
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.tool-status-active {
  background: rgba(34,199,102,0.15);
  border: 1px solid rgba(34,199,102,0.4);
  color: var(--ok);
}
.tool-status-planned {
  background: rgba(245,168,0,0.12);
  border: 1px solid rgba(245,168,0,0.3);
  color: var(--med);
}
.tool-banner-note {
  border-radius: var(--radius);
  padding: 14px 18px;
  background: linear-gradient(145deg, rgba(245,168,0,0.08), var(--surface-2));
  border: 1px solid rgba(245,168,0,0.3);
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.tool-banner-note h4 {
  font-family: var(--disp);
  font-size: 13.5px;
  margin: 0 0 4px 0;
  color: var(--med);
}
.tool-banner-note p {
  margin: 0;
  font-size: 12px;
  color: var(--text-dim);
}
.config-table td{ padding:5px 8px; border-bottom:1px solid var(--border); }

function normHeader(h) {
  return String(h == null ? "" : h).trim().toLowerCase().replace(/[^a-z0-9]/g, "");
}
function buildHeaderMap(headers) {
  const map = {};
  (headers || []).forEach(h => {
    map[normHeader(h)] = h;
  });
  return map;
}
function findHeader(headerMap, aliases) {
  for (const a of aliases) {
    const hit = headerMap[normHeader(a)];
    if (hit) return hit;
  }
  return null;
}
function resolveAliasSet(headers, aliasDict) {
  const hm = buildHeaderMap(headers);
  const resolved = {};
  Object.keys(aliasDict).forEach(k => {
    resolved[k] = findHeader(hm, aliasDict[k]);
  });
  return resolved;
}
function autoGuessCmdbMapping(headers) {
  const hm = buildHeaderMap(headers);
  const mapping = {};
  CMDB_TARGETS.forEach(t => {
    let found = null;
    for (const g of t.guesses) {
      const ng = normHeader(g);
      const exact = hm[ng];
      if (exact) {
        found = exact;
        break;
      }
    }
    if (!found) {
      // contains-match fallback
      const keys = Object.keys(hm);
      for (const g of t.guesses) {
        const ng = normHeader(g);
        const hitKey = keys.find(k => k.includes(ng) || ng.includes(k));
        if (hitKey) {
          found = hm[hitKey];
          break;
        }
      }
    }
    mapping[t.key] = found || "";
  });
  return mapping;
}
function normText(v) {
  return String(v == null ? "" : v).trim();
}
function normTextLower(v) {
  return normText(v).toLowerCase();
}
function normIP(v) {
  const s = normText(v);
  if (!s) return "";
  const parts = s.split(".");
  if (parts.length !== 4) return "";
  for (const p of parts) {
    const n = Number(p);
    if (!Number.isInteger(n) || n < 0 || n > 255) return "";
  }
  return s;
}
function isValidIP(v) {
  return normIP(v) !== "";
}

// Cloud account names / subscription names (e.g. "PROD-12345-APP") carry a 5-digit
// number that also appears in the CMDB's correlation field. Extract it from either side.
function extractFiveDigit(v) {
  const s = normText(v);
  const m = s.match(/(\d{5})/);
  return m ? m[1] : "";
}
const MONTHS = {
  jan: 0,
  feb: 1,
  mar: 2,
  apr: 3,
  may: 4,
  jun: 5,
  jul: 6,
  aug: 7,
  sep: 8,
  oct: 9,
  nov: 10,
  dec: 11
};
function parseDateFlexible(v) {
  if (v === null || v === undefined || v === "") return null;
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === "number") {
    // excel serial fallback
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    if (!isNaN(d)) return d;
    return null;
  }
  const s = String(v).trim();
  if (!s) return null;
  // dd-mmm-yyyy or dd-mmm-yy  (e.g. 20-Aug-2026)
  let m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3,})[-\/ ](\d{2,4})/);
  if (m) {
    const mon = MONTHS[m[2].toLowerCase().slice(0, 3)];
    if (mon !== undefined) {
      let yr = parseInt(m[3], 10);
      if (yr < 100) yr += 2000;
      return new Date(yr, mon, parseInt(m[1], 10));
    }
  }
  // yyyy-mm-dd
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
  // mm/dd/yyyy
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let yr = parseInt(m[3], 10);
    if (yr < 100) yr += 2000;
    return new Date(yr, parseInt(m[1], 10) - 1, parseInt(m[2], 10));

  if (!isNaN(fallback)) return fallback;

}
function fmtDate(d) {

// Keeps date columns exactly as they appeared in the uploaded raw report — if the source
// cell was text (typical for CSV or a text-formatted Excel column), that literal string is
// reused untouched. Only if the source workbook stored a true Excel date cell (parsed to a
// JS Date by SheetJS, with no original text to fall back on) is it rendered back out, using
// the same MM/DD/YYYY HH:MM:SS layout Qualys itself exports. Calculations (age, SLA, etc.)
// still use the separately-parsed Date object — this only affects what's displayed/exported.
function preserveOriginalDate(rawVal) {
  if (rawVal === null || rawVal === undefined || rawVal === "") return "";
  if (rawVal instanceof Date) {
    if (isNaN(rawVal)) return "";
    const pad = n => String(n).padStart(2, "0");
    return `${pad(rawVal.getMonth() + 1)}/${pad(rawVal.getDate())}/${rawVal.getFullYear()} ${pad(rawVal.getHours())}:${pad(rawVal.getMinutes())}:${pad(rawVal.getSeconds())}`;
  }
  return String(rawVal).trim();
}

  return diff;
}

/* ============================================================

async function parseAnyFile(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  const buf = await file.arrayBuffer();
  let wb;
  if (ext === "csv") {
    const text = new TextDecoder("utf-8").decode(buf);
    wb = XLSX.read(text, {
      type: "string",
      raw: true
    });
  } else {
    wb = XLSX.read(buf, {
      type: "array",
      cellDates: true
    });
  }
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, {
    defval: "",
    raw: true
  });
  let headers = [];
  if (rows.length) {
    headers = Object.keys(rows[0]);
  } else {
    const aoa = XLSX.utils.sheet_to_json(ws, {
      header: 1
    });
    headers = aoa[0] || [];
  }
  return {
    headers,
    rows,
    recordCount: rows.length,
    fileName: file.name,
    sheetName
  };
}

function buildAwsIndex(awsRows, fieldMap) {
  const idx = new Map();
  const dupes = new Set();
  (awsRows || []).forEach(r => {
    const ip = normIP(r[fieldMap.PrivateIpAddress]);
    if (!ip) return;
    if (idx.has(ip)) dupes.add(ip);
    if (!idx.has(ip)) idx.set(ip, []);
    idx.get(ip).push(r);
  });
  return {
    idx,
    dupes
  };
}
function buildAzureIndex(azureRows, fieldMap) {
  const idx = new Map();
  const dupes = new Set();
  (azureRows || []).forEach(r => {
    const ip = normIP(r[fieldMap.PRIVATEIP]);
    if (!ip) return;
    if (idx.has(ip)) dupes.add(ip);
    if (!idx.has(ip)) idx.set(ip, []);
    idx.get(ip).push(r);
  });
  return {
    idx,
    dupes
  };
}
function buildCmdbIndex(cmdbRows, mapping) {
  const byIP = new Map();
  const byHost = new Map();
  const byCorrelation = new Map();
  (cmdbRows || []).forEach(r => {
    if (mapping.ip) {
      const ip = normIP(r[mapping.ip]);
      if (ip) {
        if (!byIP.has(ip)) byIP.set(ip, []);
        byIP.get(ip).push(r);
      }
    }
    if (mapping.hostname) {
      const h = normTextLower(r[mapping.hostname]);
      if (h) {
        if (!byHost.has(h)) byHost.set(h, []);
        byHost.get(h).push(r);
      }
    }
    if (mapping.correlationId) {
      const corr = extractFiveDigit(r[mapping.correlationId]);
      if (corr) {
        if (!byCorrelation.has(corr)) byCorrelation.set(corr, []);
        byCorrelation.get(corr).push(r);
      }
    }
  });
  return {
    byIP,
    byHost,
    byCorrelation
  };
}
function classifyIfPci(ifVal, pciVal, ifMapped, pciMapped) {
  if (!ifMapped && !pciMapped) return {
    IF: "Unknown",
    PCI: "Unknown",
    classification: "Unknown"
  };
  const IF = ifMapped ? truthy(ifVal) ? "Yes" : "No" : "Unknown";
  const PCI = pciMapped ? truthy(pciVal) ? "Yes" : "No" : "Unknown";
  let classification = "Non-IF/Non-PCI";
  if (IF === "Unknown" && PCI === "Unknown") classification = "Unknown";else if (IF === "Yes" && PCI === "Yes") classification = "IF & PCI";else if (IF === "Yes") classification = "IF";else if (PCI === "Yes") classification = "PCI";else classification = "Non-IF/Non-PCI";
  return {
    IF,
    PCI,
    classification
  };
}
function lookupSla(slaRules, classification, risk) {
  let rule = slaRules.find(r => r.classification === classification && Number(r.risk) === Number(risk));
  if (rule) return {
    days: Number(rule.days),
    matched: true
  };
  if (classification === "IF & PCI") {
    const ifR = slaRules.find(r => r.classification === "IF" && Number(r.risk) === Number(risk));
    const pciR = slaRules.find(r => r.classification === "PCI" && Number(r.risk) === Number(risk));
    if (ifR || pciR) {
      const days = Math.min(...[ifR, pciR].filter(Boolean).map(r => Number(r.days)));
      return {
        days,
        matched: true
      };
    }
  }
  rule = slaRules.find(r => r.classification === "Non-IF/Non-PCI" && Number(r.risk) === Number(risk));
  if (rule) return {
    days: Number(rule.days),
    matched: false

    days: 30,
    matched: false

}

  const tm = normTextLower(trackingMethod);

// Vulnerability Category is decided automatically — no CMDB/config mapping required.
// Every vulnerability is classified as belonging to the "Operating System" (the underlying

const OS_CATEGORY_KEYWORDS = ["windows","microsoft windows","linux","unix","solaris","red hat","redhat","rhel","centos","suse","ubuntu","debian","aix","hp-ux","hpux","macos","mac os","os x","freebsd","netbsd","kernel","operating system","local","service pack","hotfix","security update","cumulative update","patch tuesday"];
const APP_CATEGORY_KEYWORDS = ["web application","apache","nginx","tomcat","java","php","oracle","mysql","postgres","postgresql","sql server","database","adobe","chrome","firefox","edge browser","browser","office","exchange","sharepoint","iis","ftp","ssh","openssl","node.js","nodejs","python","docker","kubernetes","jenkins","wordpress","drupal","joomla","citrix","vmware","cisco","juniper","f5","cms","mail service","dns and bind","tls/ssl","web server"];

function classifyVulnCategory(row, qMap){
  const category = normTextLower(row[qMap.Category]);
  const title = normTextLower(row[qMap.Title]);
  const os = normTextLower(row[qMap.OS]);
  const haystack = category + " " + title;
  const hasOS = OS_CATEGORY_KEYWORDS.some(k => haystack.includes(k));
  const hasApp = APP_CATEGORY_KEYWORDS.some(k => haystack.includes(k));
  if(hasOS && !hasApp) return "Operating System";
  if(hasApp && !hasOS) return "Application";
  if(hasOS && hasApp) return "Application"; // app-specific keyword found alongside a generic OS mention — treat as application-layer
  if(os && (category === "" || category === "general")) return "Operating System";
  return "Application";
}

// Shared weekly-metrics rollup — used both by the pipeline (whole dataset) and by the
// Dashboard's live filters (any filtered subset), so the two never drift out of sync.
function computeWeeklyMetricsFromRows(rows){
  return {
    "Total Vulnerabilities": rows.length,
    "New Vulnerabilities": rows.filter(r => r["Weekly Metrics"] === "New").length,
    "Existing Vulnerabilities": rows.filter(r => r["Weekly Metrics"] === "Existing").length,
    "Reopened Vulnerabilities": rows.filter(r => r["Weekly Metrics"] === "Reopened").length,
    "Fixed Vulnerabilities": rows.filter(r => r["Weekly Metrics"] === "Fixed").length,
    "Past Due Vulnerabilities": rows.filter(r => r["Within SLA/Past due SLA"] === "Past Due SLA").length,
    "Within SLA": rows.filter(r => r["Within SLA/Past due SLA"] === "Within SLA").length,
    "Severity 5": rows.filter(r => r["Risk Rating"] === 5).length,
    "Severity 4": rows.filter(r => r["Risk Rating"] === 4).length,
    "Severity 3": rows.filter(r => r["Risk Rating"] === 3).length,
    "IF Vulnerabilities": rows.filter(r => r["IF"] === "Yes").length,
    "PCI Vulnerabilities": rows.filter(r => r["PCI"] === "Yes").length,
    "AWS Vulnerabilities": rows.filter(r => r["CSP"] === "AWS").length,
    "Azure Vulnerabilities": rows.filter(r => r["CSP"] === "Azure").length
  };
}

function runPipeline({
  qualysData,
  awsData,
  azureData,
  cmdbData,
  cmdbMapping,
  config,
  previousFinalRows
}) {
  const stats = {
    qualysTotal: 0,
    sev1Removed: 0,
    sev2Removed: 0,
    invalidSeverity: 0,
    afterSeverityFilter: 0,
    awsRunningMatches: 0,
    awsNotRunning: 0,
    azureRunningMatches: 0,
    azureNotRunning: 0,
    noCloudMatch: 0,
    cmdbMatches: 0,
    cmdbDuplicates: 0,
    cmdbMissing: 0,
    finalOutcome: 0,
    invalidIP: 0,
    missingQID: 0
  };
  const exceptions = [];
  const addException = (row, reason, source, details) => {
    exceptions.push({
      IP: row ? row[qMap.IP] || "" : "",
      QID: row ? row[qMap.QID] || "" : "",
      Reason: reason,
      Source: source || "",
      Details: details || ""
    });
  };
  const qHeaders = qualysData ? qualysData.headers : [];
  const qMap = resolveAliasSet(qHeaders, QUALYS_ALIASES);
  const aHeaders = awsData ? awsData.headers : [];
  const aMap = resolveAliasSet(aHeaders, AWS_ALIASES);
  const zHeaders = azureData ? azureData.headers : [];
  const zMap = resolveAliasSet(zHeaders, AZURE_ALIASES);
  const awsIndex = buildAwsIndex(awsData ? awsData.rows : [], aMap);
  const azureIndex = buildAzureIndex(azureData ? azureData.rows : [], zMap);
  const cmdbIndex = buildCmdbIndex(cmdbData ? cmdbData.rows : [], cmdbMapping);
  const exceptionApprovalSet = new Set();
  (config.exceptionApprovals || []).forEach(rule => {
    const apm = normTextLower(rule.apmId);
    if (!apm) return;
    (rule.vulnNames || []).forEach(vn => exceptionApprovalSet.add(apm + "|||" + normTextLower(vn)));
  });
  const qualysRows = qualysData ? qualysData.rows : [];
  stats.qualysTotal = qualysRows.length;
  stats.exceptionApprovedCount = 0;
  const reportDate = parseDateFlexible(config.reportDate) || new Date();
  const todayForAge = new Date();
  todayForAge.setHours(0, 0, 0, 0);
  const minSeverity = safeNum(config.severityMin, 3);

  // previous week index for New/Existing/Reopened/Fixed comparison
  let prevIdSet = null;
  if (previousFinalRows && previousFinalRows.length) {
    prevIdSet = new Set(previousFinalRows.map(r => r["Unique id"]));
  }
  const finalRows = [];
  const awsOnly = [];
  const azureOnly = [];
  qualysRows.forEach(row => {
    const sevRaw = row[qMap.Severity];
    const sev = safeNum(sevRaw, null);
    if (sev === null) {
      stats.invalidSeverity++;
      addException(row, "Invalid Severity", "Qualys", `Severity value: ${sevRaw}`);
      return;
    }
    if (sev === 1) {
      stats.sev1Removed++;
      return;
    }
    if (sev === 2) {
      stats.sev2Removed++;
      return;
    }
    if (sev < minSeverity) {
      return;
    }
    const ipRaw = row[qMap.IP];
    const ip = normIP(ipRaw);
    if (!ip) {
      stats.invalidIP++;
      addException(row, "Invalid IP", "Qualys", `IP value: ${ipRaw}`);
      return;
    }
    const qid = normText(row[qMap.QID]);
    if (!qid) {
      stats.missingQID++;
      addException(row, "Missing QID", "Qualys", "");
      return;
    }
    stats.afterSeverityFilter++;
    const uniqueId = `${ip}/${qid}`;
    const vulnerabilityId = `${ip}/${qid}`;

    // Cloud matching
    let csp = "",
      cloudAccountName = "",
      impactedAsset = ip,
      cloudEnv = "";
    let matchedCloud = false;
    const awsHit = awsIndex.idx.get(ip);
    if (awsHit && awsHit.length) {
      if (awsIndex.dupes.has(ip)) addException(row, "Duplicate AWS IP", "AWS", `${awsHit.length} AWS records share IP ${ip}`);
      const rec = awsHit[0];
      const state = normTextLower(rec[aMap.InstanceState]);
      if (state === "running") {
        matchedCloud = true;
        csp = "AWS";
        cloudAccountName = normText(rec[aMap.AccountName]);
        impactedAsset = ip;
        stats.awsRunningMatches++;
        awsOnly.push({
          __ip: ip,
          __qid: qid,
          rec,
          qrow: row
        });
      } else {
        stats.awsNotRunning++;
        addException(row, "AWS IP Not Running", "AWS", `InstanceState=${rec[aMap.InstanceState]}`);
      }
    }
    if (!matchedCloud) {
      const azHit = azureIndex.idx.get(ip);
      if (azHit && azHit.length) {
        if (azureIndex.dupes.has(ip)) addException(row, "Duplicate Azure IP", "Azure", `${azHit.length} Azure records share IP ${ip}`);
        const rec = azHit[0];
        const state = normTextLower(rec[zMap.STATUS]);
        if (state === "running") {
          matchedCloud = true;
          csp = "Azure";
          cloudAccountName = normText(rec[zMap.SUBSCRIPTION]);
          impactedAsset = ip;
          stats.azureRunningMatches++;
          azureOnly.push({
            __ip: ip,
            __qid: qid,
            rec,
            qrow: row
          });
        } else {
          stats.azureNotRunning++;
          addException(row, "Azure IP Not Running", "Azure", `STATUS=${rec[zMap.STATUS]}`);
        }
      }
    }
    if (!matchedCloud) {
      stats.noCloudMatch++;
      addException(row, "No Cloud Inventory Match", "Cloud", `IP ${ip} not found running in AWS or Azure`);
    }

    // CMDB matching — priority: IP, then Correlation ID (5-digit code shared between
    // the cloud Account/Subscription name and the CMDB correlation field), then hostname.
    let cmdbRec = null,
      cmdbDup = false,
      cmdbMatchMethod = "";
    if (cmdbMapping.ip) {
      const hits = cmdbIndex.byIP.get(ip);
      if (hits && hits.length) {
        cmdbRec = hits[0];
        cmdbMatchMethod = "IP";
        if (hits.length > 1) {
          cmdbDup = true;
        }
      }
    }
    let correlationCode = "";
    if (!cmdbRec && cmdbMapping.correlationId && cloudAccountName) {
      correlationCode = extractFiveDigit(cloudAccountName);
      if (correlationCode) {
        const hits = cmdbIndex.byCorrelation.get(correlationCode);
        if (hits && hits.length) {
          cmdbRec = hits[0];
          cmdbMatchMethod = "Correlation ID";
          if (hits.length > 1) {
            cmdbDup = true;
          }
        }
      }
    }
    if (!cmdbRec && cmdbMapping.hostname) {
      const hn = normTextLower(row[qMap.DNS]) || normTextLower(row[qMap.NetBIOS]);
      if (hn) {
        const hits = cmdbIndex.byHost.get(hn);
        if (hits && hits.length) {
          cmdbRec = hits[0];
          cmdbMatchMethod = "Hostname";
          if (hits.length > 1) {
            cmdbDup = true;
          }
        }
      }
    }
    if (cmdbRec) {
      stats.cmdbMatches++;
      if (cmdbMatchMethod === "IP") stats.cmdbMatchByIP = (stats.cmdbMatchByIP || 0) + 1;
      if (cmdbMatchMethod === "Correlation ID") stats.cmdbMatchByCorrelation = (stats.cmdbMatchByCorrelation || 0) + 1;
      if (cmdbMatchMethod === "Hostname") stats.cmdbMatchByHostname = (stats.cmdbMatchByHostname || 0) + 1;
      if (cmdbDup) {
        stats.cmdbDuplicates++;
        addException(row, "CMDB Duplicate Match", "CMDB", `Multiple CMDB records matched via ${cmdbMatchMethod} for ${cmdbMatchMethod === "Correlation ID" ? "code " + correlationCode : ip}`);
      }
    } else {
      stats.cmdbMissing++;
      addException(row, "CMDB Match Missing", "CMDB", correlationCode ? `No CMDB record for IP ${ip} or correlation code ${correlationCode}` : `No CMDB record for IP ${ip}`);
    }
    const appName = cmdbRec && cmdbMapping.appName ? normText(cmdbRec[cmdbMapping.appName]) : "";
    const apmId = cmdbRec && cmdbMapping.apmId ? normText(cmdbRec[cmdbMapping.apmId]) : "";
    if (cmdbRec) {
      if (!appName) addException(row, "Missing Application", "CMDB", "CMDB matched but Application Name blank");
      if (!apmId) addException(row, "Missing APM ID", "CMDB", "CMDB matched but APM ID blank");
    }
    const ifPci = classifyIfPci(cmdbRec ? cmdbRec[cmdbMapping.ifFlag] : null, cmdbRec ? cmdbRec[cmdbMapping.pciFlag] : null, !!cmdbMapping.ifFlag && !!cmdbRec, !!cmdbMapping.pciFlag && !!cmdbRec);
    const appOwner = cmdbRec && cmdbMapping.appOwner ? normText(cmdbRec[cmdbMapping.appOwner]) : "";
    const organization = cmdbRec && cmdbMapping.organization ? normText(cmdbRec[cmdbMapping.organization]) : "";
    const environment = cmdbRec && cmdbMapping.environment ? normText(cmdbRec[cmdbMapping.environment]) : "Unknown";
    const vulnCategory = classifyVulnCategory(row, qMap);
    const source = "IVM";
    const scanType = deriveScanType(row[qMap.TrackingMethod], config.scanTypeRules);
    const firstFound = parseDateFlexible(row[qMap.FirstDetected]);
    const firstFoundMidnight = firstFound ? new Date(firstFound.getFullYear(), firstFound.getMonth(), firstFound.getDate()) : null;
    const age = firstFoundMidnight ? Math.max(0, daysBetween(todayForAge, firstFoundMidnight)) : null;
    const slaLookup = lookupSla(config.slaRules, ifPci.classification, sev);
    const slaDays = slaLookup.days;
    if (!slaLookup.matched) {
      addException(row, "Missing SLA Config", "SLA", `No explicit SLA rule for ${ifPci.classification} / Risk ${sev} — used fallback ${slaDays}d`);
    }
    const vulnStatus = normText(row[qMap.VulnStatus]);
    const isFixed = /fixed/i.test(vulnStatus);
    let withinSla = "Unknown";
    if (isFixed) withinSla = "Fixed";else if (age !== null) withinSla = age <= slaDays ? "Within SLA" : "Past Due SLA";
    const timesReopened = safeNum(row[qMap.TimesReopened], 0);
    let weeklyBucket = "Existing";
    if (isFixed) weeklyBucket = "Fixed";else if (timesReopened > 0) weeklyBucket = "Reopened";else if (prevIdSet) {
      weeklyBucket = prevIdSet.has(uniqueId) ? "Existing" : "New";
    } else if (firstFound) {
      weeklyBucket = daysBetween(reportDate, firstFound) <= 7 ? "New" : "Existing";
    }
    const vulnerabilityName = normText(row[qMap.Title]);
    let displayVulnStatus = vulnStatus;
    if (exceptionApprovalSet.has(normTextLower(apmId) + "|||" + normTextLower(vulnerabilityName))) {
      displayVulnStatus = "Exception Approved";
      stats.exceptionApprovedCount++;
    }
    const finalObj = {
      "Application Name": appName,
      "APM ID": apmId,
      "Scan Type": scanType,
      "IP": ip,
      "DNS": normText(row[qMap.DNS]),
      "NetBIOS": normText(row[qMap.NetBIOS]),
      "Tracking Method": normText(row[qMap.TrackingMethod]),
      "OS": normText(row[qMap.OS]),
      "IP Status": normText(row[qMap.IPStatus]),
      "Unique id": uniqueId,
      "Vulnerability Name": vulnerabilityName,
      "Vulnerability Status": displayVulnStatus,
      "Type": normText(row[qMap.Type]),
      "Risk Rating": sev,
      "Port": normText(row[qMap.Port]),
      "Protocol": normText(row[qMap.Protocol]),
      "FQDN": normText(row[qMap.FQDN]),
      "SSL": normText(row[qMap.SSL]),
      "First Found date": preserveOriginalDate(row[qMap.FirstDetected]),
      "Last Detected": preserveOriginalDate(row[qMap.LastDetected]),
      "Times Detected": normText(row[qMap.TimesDetected]),
      "Date Last Fixed": preserveOriginalDate(row[qMap.DateLastFixed]),
      "First Reopened": preserveOriginalDate(row[qMap.FirstReopened]),
      "Last Reopened": preserveOriginalDate(row[qMap.LastReopened]),
      "Times Reopened": timesReopened,
      "CVE ID": normText(row[qMap.CVEID]),
      "Vendor Reference": normText(row[qMap.VendorReference]),
      "Bugtraq ID": normText(row[qMap.BugtraqID]),
      "Threat": normText(row[qMap.Threat]),
      "Impact": normText(row[qMap.Impact]),
      "Recommendation": normText(row[qMap.Solution]),
      "Exploitability": normText(row[qMap.Exploitability]),
      "Results": normText(row[qMap.Results]),
      "PCI Vuln": normText(row[qMap.PCIVuln]),
      "Ticket State": normText(row[qMap.TicketState]),
      "Instance": normText(row[qMap.Instance]),
      "Category": normText(row[qMap.Category]),
      "QDS": normText(row[qMap.QDS]),
      "ARS": normText(row[qMap.ARS]),
      "ACS": normText(row[qMap.ACS]),
      "TruRisk Score": normText(row[qMap.TruRiskScore]),
      "IF or PCI": ifPci.classification,
      "Source": source,
      "SLA": slaDays,
      "Vulnerability Age": age === null ? "" : age,
      "App Owner": appOwner,
      "Organization": organization,
      "IF": ifPci.IF,
      "PCI": ifPci.PCI,
      "Impacted Asset": impactedAsset,
      "Cloud Account Name": cloudAccountName,
      "Environment": environment,
      "CSP": csp || "Unknown",
      "Vulnerability ID": vulnerabilityId,
      "Vulnerability Category": vulnCategory,
      "Within SLA/Past due SLA": withinSla,
      "Weekly Metrics": weeklyBucket
    };
    finalRows.push(finalObj);
  });
  stats.finalOutcome = finalRows.length;

  // Weekly metrics (overall)
  const wm = computeWeeklyMetricsFromRows(finalRows);
  let weekOverWeek = null;
  if (previousFinalRows && previousFinalRows.length) {
    const prevTotal = previousFinalRows.length;
    const curTotal = finalRows.length;
    const change = curTotal - prevTotal;
    const pct = prevTotal ? change / prevTotal * 100 : 0;
    weekOverWeek = {
      prevTotal,
      curTotal,
      change,
      pct
    };
  }

  // Fixed vulnerabilities — identified three ways:
  //  1) Qualys marks it Fixed in the current processed report on its own (works even with
  //     only the Qualys raw report uploaded — no previous week or cloud/CMDB data needed).
  //  2) It existed in last week's processed Final Outcome but no longer appears in this
  //     week's (i.e. it was remediated) — requires the optional previous-week upload.
  //  3) Comparing last week's processed report against this week's processed report is what
  //     powers the severity-wise fixed breakdown below.
  let fixedComparison = null;
  if (finalRows.length) {
    const hasPreviousWeek = !!(previousFinalRows && previousFinalRows.length);
    const currentIds = new Set(finalRows.map(r => r["Unique id"]));
    const disappeared = hasPreviousWeek ? previousFinalRows.filter(r => !currentIds.has(r["Unique id"])) : [];
    const explicitlyFixedNow = finalRows.filter(r => r["Within SLA/Past due SLA"] === "Fixed");
    const seen = new Set();
    const fixedRecords = [];
    disappeared.forEach(r => {
      const id = r["Unique id"];
      if (!seen.has(id)) {
        seen.add(id);
        const idParts = String(id).split("/");
        fixedRecords.push({ ...r, __fixReason: "Remediated (no longer in this week's report)", __qid: idParts.slice(1).join("/") || "" });
      }
    });
    explicitlyFixedNow.forEach(r => {
      const id = r["Unique id"];
      if (!seen.has(id)) {
        seen.add(id);
        const idParts = String(id).split("/");
        fixedRecords.push({ ...r, __fixReason: "Marked Fixed in Qualys", __qid: idParts.slice(1).join("/") || "" });
      }
    });

    const byCSPMap = new Map();
    const byAppMap = new Map();
    const byRiskMap = new Map([[5, 0], [4, 0], [3, 0]]);
    fixedRecords.forEach(r => {
      const csp = r["CSP"] || "Unknown";
      byCSPMap.set(csp, (byCSPMap.get(csp) || 0) + 1);
      const app = r["Application Name"] || "(Unmapped)";
      byAppMap.set(app, (byAppMap.get(app) || 0) + 1);
      const risk = r["Risk Rating"];
      if (byRiskMap.has(risk)) byRiskMap.set(risk, byRiskMap.get(risk) + 1);
    });
    const byCSP = Array.from(byCSPMap.entries()).map(([csp, count]) => ({ CSP: csp, Fixed: count })).sort((a, b) => b.Fixed - a.Fixed);
    const byApp = Array.from(byAppMap.entries()).map(([app, count]) => ({ Application: app, Fixed: count })).sort((a, b) => b.Fixed - a.Fixed);
    const byRisk = [5, 4, 3].map(risk => ({ risk, label: SEVERITY_LABEL[risk], Fixed: byRiskMap.get(risk) || 0 }));
    fixedComparison = { total: fixedRecords.length, byCSP, byApp, byRisk, hasPreviousWeek, records: fixedRecords };
  }

  // New vs Existing vulnerabilities — compares this week's report against last week's by
  // Vulnerability ID (== Unique id, IP/QID). Anything whose Vulnerability ID wasn't present
  // last week is "New"; anything that was already there is "Existing". Only meaningful once
  // a previous week's Final Outcome file has been uploaded.
  let newVulnComparison = null;
  if (finalRows.length && previousFinalRows && previousFinalRows.length) {
    const newRecords = finalRows.filter(r => r["Weekly Metrics"] === "New");
    const existingRecords = finalRows.filter(r => r["Weekly Metrics"] === "Existing");
    const byCSPMap = new Map();
    const byAppMap = new Map();
    const byRiskMap = new Map([[5, 0], [4, 0], [3, 0]]);
    newRecords.forEach(r => {
      const csp = r["CSP"] || "Unknown";
      byCSPMap.set(csp, (byCSPMap.get(csp) || 0) + 1);
      const app = r["Application Name"] || "(Unmapped)";
      byAppMap.set(app, (byAppMap.get(app) || 0) + 1);
      const risk = r["Risk Rating"];
      if (byRiskMap.has(risk)) byRiskMap.set(risk, byRiskMap.get(risk) + 1);
    });
    const byCSP = Array.from(byCSPMap.entries()).map(([csp, count]) => ({ CSP: csp, Count: count })).sort((a, b) => b.Count - a.Count);
    const byApp = Array.from(byAppMap.entries()).map(([app, count]) => ({ Application: app, Count: count })).sort((a, b) => b.Count - a.Count);
    const byRisk = [5, 4, 3].map(risk => ({ risk, label: SEVERITY_LABEL[risk], Count: byRiskMap.get(risk) || 0 }));
    newVulnComparison = { newTotal: newRecords.length, existingTotal: existingRecords.length, byCSP, byApp, byRisk, newRecords, existingRecords };
  }

  // Application metrics
  const appGroups = new Map();
  finalRows.forEach(r => {
    const key = `${r["Application Name"]}|||${r["APM ID"]}`;
    if (!appGroups.has(key)) {
      appGroups.set(key, {
        "Application": r["Application Name"] || "(Unmapped)",
        "APM ID": r["APM ID"] || "",
        "App Owner": r["App Owner"],
        "Organization": r["Organization"],
        Total: 0,
        Sev5: 0,
        Sev4: 0,
        Sev3: 0,
        PastDue: 0
      });
    }
    const g = appGroups.get(key);
    g.Total++;
    if (r["Risk Rating"] === 5) g.Sev5++;
    if (r["Risk Rating"] === 4) g.Sev4++;
    if (r["Risk Rating"] === 3) g.Sev3++;
    if (r["Within SLA/Past due SLA"] === "Past Due SLA") g.PastDue++;
  });
  const appMetrics = Array.from(appGroups.values()).sort((a, b) => b.Total - a.Total);
  const processingSummary = [{
    Metric: "Total Qualys Records",
    Value: stats.qualysTotal
  }, {
    Metric: "Severity 1 Removed",
    Value: stats.sev1Removed
  }, {
    Metric: "Severity 2 Removed",
    Value: stats.sev2Removed
  }, {
    Metric: "Invalid Severity Removed",
    Value: stats.invalidSeverity
  }, {
    Metric: "Invalid IP Removed",
    Value: stats.invalidIP
  }, {
    Metric: "Missing QID Removed",
    Value: stats.missingQID
  }, {
    Metric: "After Severity Filter",
    Value: stats.afterSeverityFilter
  }, {
    Metric: "AWS Running Matches",
    Value: stats.awsRunningMatches
  }, {
    Metric: "AWS Not-Running Excluded From Cloud Match",
    Value: stats.awsNotRunning
  }, {
    Metric: "Azure Running Matches",
    Value: stats.azureRunningMatches
  }, {
    Metric: "Azure Not-Running Excluded From Cloud Match",
    Value: stats.azureNotRunning
  }, {
    Metric: "No Cloud Inventory Match",
    Value: stats.noCloudMatch
  }, {
    Metric: "CMDB Matches",
    Value: stats.cmdbMatches
  }, {
    Metric: "CMDB Matches via IP",
    Value: stats.cmdbMatchByIP || 0
  }, {
    Metric: "CMDB Matches via Correlation ID",
    Value: stats.cmdbMatchByCorrelation || 0
  }, {
    Metric: "CMDB Matches via Hostname",
    Value: stats.cmdbMatchByHostname || 0
  }, {
    Metric: "CMDB Duplicate Matches",
    Value: stats.cmdbDuplicates
  }, {
    Metric: "CMDB Match Missing",
    Value: stats.cmdbMissing
  }, {
    Metric: "Final Outcome Records",
    Value: stats.finalOutcome
  }, {
    Metric: "Exception Log Entries",
    Value: exceptions.length
  }, {
    Metric: "Report Date",
    Value: fmtDate(reportDate)
  }, {
    Metric: "Vulnerability Age Calculated As Of",
    Value: fmtDate(todayForAge)
  }, {
    Metric: "Exception Approved Overrides Applied",
    Value: stats.exceptionApprovedCount
  }];
  return {
    finalRows,
    exceptions,
    weeklyMetrics: wm,
    appMetrics,
    processingSummary,
    stats,
    weekOverWeek,
    fixedComparison,
    newVulnComparison,
    awsRows: awsOnly.map(x => finalRows.find(r => r["Unique id"] === `${x.__ip}/${x.__qid}`)).filter(Boolean),
    azureRows: azureOnly.map(x => finalRows.find(r => r["Unique id"] === `${x.__ip}/${x.__qid}`)).filter(Boolean)
  };
}

/* ============================================================
   EXPORT (XLSX / CSV)
   ============================================================ */

function rowsToAOA(rows, columns) {
  const aoa = [columns];
  rows.forEach(r => aoa.push(columns.map(c => r[c] === undefined ? "" : r[c])));
  return aoa;
}
function buildWorkbook(result, reportDateStr) {
  const wb = XLSX.utils.book_new();
  const wsFinal = XLSX.utils.aoa_to_sheet(rowsToAOA(result.finalRows, FINAL_COLUMNS));
  XLSX.utils.book_append_sheet(wb, wsFinal, "Final Outcome");
  const wmRows = Object.keys(result.weeklyMetrics).map(k => ({
    Metric: k,
    Value: result.weeklyMetrics[k]
  }));
  if (result.weekOverWeek) {
    wmRows.push({
      Metric: "Previous Week Total",
      Value: result.weekOverWeek.prevTotal
    });
    wmRows.push({
      Metric: "Change vs Previous Week",
      Value: result.weekOverWeek.change
    });
    wmRows.push({
      Metric: "Percent Change",
      Value: `${result.weekOverWeek.pct.toFixed(2)}%`
